# License gate for the static graph. The accepted set is plans/archive/License-Review.md.
# `cargo deny check` is the default feature graph on x86_64-unknown-linux-gnu.
# Servo (an in-process PDF alternate once planned as `pdf-servo`) is not linked.
# MPL-2.0 is not in the allow list, so it would fail this check until it has its own review.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
yanked = "deny"
# Transitive unmaintained crates (webpki 0.22, pulled by mysql) stay until
# mysql moves to rustls-webpki. A vulnerability still fails the check.
unmaintained = "workspace"
ignore = [
    # rsa 0.10.0-rc.18 via russh and huskarl. No patched release as of this
    # advisory. plans/archive/License-Review.md accepts those crates.
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing in rsa. No safe upgrade. Used by russh and huskarl." },
]

[licenses]
# cargo-deny 0.20 removed the `unlicensed` key. An unlicensed crate is an error.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "PostgreSQL",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MIT-0",
]
# ammonia (HTML cleaning for allow-html="safe") needs cssparser and dtoa-short, which are
# MPL-2.0. Unmodified static use only asks for those files' source, which crates.io serves.
# No other crate may be MPL-2.0. plans/archive/License-Review.md records the exception.
# The XMPP server (moqui-xmpp, D-C3) links minidom and jid, MPL-2.0, unmodified: each its own named exception with a
# License-Review row. Its test client (tokio-xmpp, xmpp-parsers, xso, sasl) is a dev-dependency, outside this graph.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "minidom" },
    { allow = ["MPL-2.0"], crate = "jid" },
]

# webpki 0.22 publishes license-file and no SPDX expression.
# LICENSE is ISC. third-party/chromium/LICENSE is BSD-3-Clause.
[[licenses.clarify]]
crate = "webpki@0.22.4"
expression = "ISC AND BSD-3-Clause"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
    { path = "third-party/chromium/LICENSE", hash = 0x9b209a1a },
]

[bans]
# The lockfile has duplicate versions across russh, huskarl, mysql, and sqlx.
# Unifying them is separate from the license gate.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
    { crate = "libz-sys", reason = "flate2 stays on the pure Rust backend" },
    { crate = "libssh2-sys", reason = "SSH is russh" },
    { crate = "ssh2", reason = "SSH is russh" },
    { crate = "servo", reason = "MPL-2.0. Not linked until a separate deny report" },
]

# oxc_parser is named in the workspace and linked in phase 6.
[bans.workspace-dependencies]
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# quickjs-oxide, the moqui fork (plans/archive/Script-Engine-Oxide.md §6).
allow-git = ["https://github.com/moqui/quickjs-oxide"]
