# The Rust side of the dev-aide (plans/design-dev-aide.md 3.3): the workspace file operations with their confinement, the
# git layer over the developer's own git command, and the services the screens call. A member of the mr-moqui workspace,
# linked by crates/moqui under the devtools feature (the Dev and Debug packages); in a binary without it the component's
# screens load on a dev instance but its services are not built in.

[package]
name = "dev-aide"
description = "Dev AIDE, the assisted IDE: workspace files, git and the services of its screens."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moqui-core = { workspace = true }
# The development tools the dev-aide serves: reload, check, the artifact index (plans/Crate-Split.md).
moqui-devkit = { workspace = true }
moqui-llm = { workspace = true }
moqui-lib = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

[lints]
workspace = true
