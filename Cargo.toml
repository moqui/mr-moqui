# Candidate workspace. Crate cut: plans/archive/Crate-Layout.md.
# Feature rows: plans/archive/License-Review.md (resolved 2026-10-11).
# `cargo tree -p moqui` is the default binary. Cargo.lock is the exact resolve.
#
# license is CC0-1.0. The patent grant in LICENSE.md has no SPDX identifier.
# The workspace needs Rust 1.99 (rust-toolchain.toml): quickjs-oxide declares rust-version 1.99, mail-parser 1.0 1.98,
# and oxc 0.153 and later 1.97. This file does not set rust-version, so `cargo metadata` and `cargo tree` still run on
# older cargo.

[workspace]
resolver = "2"
members = [
    "crates/moqui-lib",
    "crates/moqui-db",
    "crates/moqui-entity",
    "crates/moqui-core",
    "crates/moqui-llm",
    "crates/moqui-git",
    "crates/moqui-mail",
    "crates/moqui-report",
    "crates/moqui-collab",
    "crates/moqui-tools",
    "crates/moqui-rtc",
    "crates/moqui-sip",
    "crates/moqui-channels",
    "crates/moqui-xmpp",
    "crates/moqui-dav",
    "crates/moqui-devkit",
    "crates/moqui-drivers",
    "crates/moqui-host",
    "crates/moqui-browser",
    "crates/moqui",
    "crates/moqui-tui",
    # The client of a remote server for the desktop app's client mode (plans/Mobile-Desktop.md, MD3); no Tauri.
    "crates/moqui-client",
    # The framework's dev components, linked by crates/moqui under devtools; see crates/moqui/src/main.rs.
    "runtime/dev-component/dev-aide",
    "runtime/dev-component/example",
]
# Add-on component crates are linked by `./moq build` through a generated crate in target/moqui-app, not by this
# workspace. Excluded so cargo run inside one of them treats it as its own root.
# runtime/dev-component holds a user's own dev components beside the framework's, which are members above.
exclude = ["runtime/component", "runtime/ecomponent", "runtime/dev-component", "crates/moqui-desktop"]

[workspace.package]
edition = "2021"
license = "CC0-1.0"
publish = false
version = "0.1.0"

# `cargo clippy` fails on Clippy's default set. `priority = -1` lets an
# item `#[allow]` override one lint. Pedantic, nursery, and restriction
# stay off. `cargo lint` also denies rustc warnings.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Check with RUSTFLAGS=-Dwarnings instead of denying here, so a new rustc does not break a build.
[workspace.lints.rust]
unexpected_cfgs = { level = "deny", priority = -1 }

# The build profiles are in .cargo/config.toml, so the generated crate `./moq build` links add-on components through
# (target/moqui-app, its own workspace) builds the same way as this one.

[workspace.dependencies]
moqui-lib = { path = "crates/moqui-lib" }
moqui-db = { path = "crates/moqui-db" }
# The entity facade, the transaction manager and DbDriver, below moqui-core (plans/archive/Crate-Split.md).
moqui-entity = { path = "crates/moqui-entity" }
# default-features off so moqui-browser can leave out mail, http, and cluster-tls; moqui-host names them.
moqui-core = { path = "crates/moqui-core", default-features = false }
# The agent runtime, on moqui-core (plans/LLM-A2A-Assist.md); the host links it under its llm feature.
moqui-llm = { path = "crates/moqui-llm" }
# git:// locations, the git services and the git server, on moqui-core (plans/archive/Crate-Split.md); the host links it
# under its git feature.
moqui-git = { path = "crates/moqui-git" }
# The email services, on moqui-core (plans/archive/Crate-Split.md); the host links it under its smtp feature, and turns
# on its imap feature under its own. default-features off so a host without imap leaves it out.
moqui-mail = { path = "crates/moqui-mail", default-features = false }
# Reports, dashboards, alerts, report schedules and monitoring keys, on moqui-core (plans/archive/Crate-Split.md); the
# host and the browser link it in every build. default-features off so the browser leaves out xlsx.
moqui-report = { path = "crates/moqui-report", default-features = false }
# Co-edited documents and the collab services, on moqui-core (plans/archive/Crate-Split.md); the host links it in every
# build.
moqui-collab = { path = "crates/moqui-collab" }
# The Tools app's server side (database capabilities, catalog queries, jobs, SQL runs, the data grid, ETL), on
# moqui-core (plans/archive/Tools-Database.md §13); the host links it in every build.
moqui-tools = { path = "crates/moqui-tools" }
# Calls: the WebRTC endpoint and the selective forwarding unit on str0m, sans-IO (plans/Comms-Framework.md §6); the host
# links it under its rtc feature and owns the sockets.
moqui-rtc = { path = "crates/moqui-rtc" }
# Business messaging channels: the SMS adapter on Telnyx (plans/Comms-Framework.md §4.3, §5.6, C4-SMS); the host links it
# under its channels feature.
moqui-channels = { path = "crates/moqui-channels" }
# Phone calls: the SIP user agent and B2BUA over moqui-rtc's audio core (plans/Comms-Framework.md §5.2, D-V1); the host
# links it under its sip feature and owns the RTP sockets.
moqui-sip = { path = "crates/moqui-sip" }
# XMPP for local users: the client stream, SASL2, SCRAM and FAST, and the chat mapping (plans/Comms-Framework.md §4.3,
# C3a); the host links it under its xmpp feature, owns the listeners and runs the chat services it names.
moqui-xmpp = { path = "crates/moqui-xmpp" }
# The DAV server, the VCard and ICalendar tools and the elFinder connector, on moqui-core
# (plans/archive/Crate-Split.md); the host links it in every build.
moqui-dav = { path = "crates/moqui-dav" }
# The development kit (reload, the file watcher, check, the artifact index, typegen, the spec runner), on moqui-core
# (plans/archive/Crate-Split.md); the host links it in every build, and its watch feature under devtools.
moqui-devkit = { path = "crates/moqui-devkit" }
# The database drivers, out of moqui-host (plans/archive/Crate-Split.md); the host links it and forwards postgres, mysql
# and embedded-postgres.
moqui-drivers = { path = "crates/moqui-drivers" }
# default-features off so the binary crate picks the package (crates/moqui, docs/Build-Test.md).
moqui-host = { path = "crates/moqui-host", default-features = false }
# The framework's dev component crates, kept in runtime/dev-component, linked by crates/moqui under devtools.
dev-aide = { path = "runtime/dev-component/dev-aide" }
example = { path = "runtime/dev-component/example" }
# default-features off so a model-only user (moqui-core tests) does not compile Revue.
moqui-tui = { path = "crates/moqui-tui", default-features = false }
# Exact pin. default-features off so `async` (tokio) and `config` stay out.
# moqui-tui turns on `markdown` only. Rust 1.95. Not a dependency of `moqui`.
revue = { version = "=3.12.0", default-features = false }

# --- moqui-lib ---
# QR Model 2 and Data Matrix ECC 200, emitted as inline SVG by the print helpers.
qrcodegen = "1.8.0"
datamatrix = { version = "0.3.3", default-features = false }
jiff = "0.2"
regex = "1"
# serde is already in the crate's default set. Named so it stays if defaults change.
rust_decimal = { version = "1", features = ["serde"] }
indexmap = "2"
# A fast hash for the internal maps keyed by SQL or script text and frame tokens. Already in the tree under hashbrown.
foldhash = "0.2"
# The binaries' global allocator (crates/moqui, and the binary ./moq build generates); not on MSVC.
tikv-jemallocator = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Signer stand-ins. Stay in RustCrypto (or aws-lc). No OpenSSL.
hmac = "0.13"
# Ed25519 webhook signatures (moqui-channels): the aws-lc-rs that rustls, rcgen and str0m already link, with the default
# features they turn on.
aws-lc-rs = "1.19"
sha2 = "0.11"
# Substring search of multipart bodies (crates/moqui-core/src/web/multipart.rs). Already in the graph.
memchr = "2.8"
sha1 = { version = "0.11", features = ["oid"] }
base64 = "0.23"
# Inherited descriptors marked close-on-exec before the embedded Postgres starts (moqui-drivers), safely.
close_fds = "0.3"
# SimpleSigner (RSA SHA1withRSA, PKCS#1 v1.5). The rsa release candidate is the one russh and huskarl already
# resolve, so the graph has one rsa. Its digest 0.11 is the sha1 and sha2 above (oid on sha1 for the PKCS#1 prefix).
# plans/archive/License-Review.md records RUSTSEC-2023-0071.
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
rand_core = "0.10"
# Name rustls. On 0.13 that is aws-lc, but default-tls must not be inherited:
# a later release could point default-tls back at native-tls.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
    "multipart",
    "charset",
] }

# Charsets for SFTP text (SystemMessageRemote.remoteCharset). Already in the graph under reqwest.
encoding_rs = "0.8"

# --- moqui-core (no direct tokio, axum, postgres, mysql, or postgresql_embedded) ---
# Linked component crates submit their implementation catalogue (moqui_core::native::submit_component!).
inventory = "0.3.25"
# Field encryption. pbkdf2 0.13 is on the hmac 0.13 and sha2 0.11 above.
# aes, cbc, and des share cipher 0.5. cbc alloc is the Vec padding API.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
pbkdf2 = "0.13"
md-5 = "0.11"

# Mail (moqui-mail): lettre, imap, mail-parser; rustls and webpki-roots are the host's too.
# Do not enable the feature named rustls-tls: on this crate it selects ring.
# hostname is an optional dependency feature. tokio1 stays off, so SMTP is not async.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls",
    "aws-lc-rs",
    "webpki-roots",
] }
# Blocking IMAP. The default feature native-tls stays off, and so does rustls-tls (rustls-connector).
# The TCP stream is wrapped with rustls below. Pinned 3.0 alpha: 2.x uses nom 5, which pulls
# lexical-core 0.7 (RUSTSEC-2024-0377); 3.0 uses nom 7.
imap = { version = "=3.0.0-alpha.15", default-features = false }
# Inbound MIME for poll#EmailServer: nested multiparts, RFC 2047 words, charsets, folded headers. Defaults are
# empty; the single-byte charsets are built in. `full_encoding` (encoding_rs for multi-byte CJK) is on through mail-auth
# below.
mail-parser = { version = "1", default-features = false }
# Mail authentication (moqui-mail `auth`, plans/Edge-Node.md §5.4 E5b): SPF, DKIM, DMARC and ARC verified, DKIM signed,
# MTA-STS records. aws-lc-rs is its crypto (it pins aws-lc-sys 0.46 beside the 0.47 aws-lc-rs links, so AWS-LC is built
# twice; rust-crypto would add a second rsa instead) and hickory its DNS. It turns on mail-parser's full_encoding.
mail-auth = { version = "0.15", default-features = false, features = ["aws-lc-rs", "arc"] }
# The DNS resolver mail-auth queries through, configured here (moqui-mail `dns`: MX, TXT, A and AAAA, for the MTA and
# E10's DNS checks). Its defaults are system-config and the Tokio runtime.
hickory-resolver = "0.26"
# Direct so IMAP and POP3 can build a ClientConfig on aws-lc. ring stays off.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"
# The OS trust store for the desktop client's sockets (crates/moqui-client), as reqwest's rustls verifies its requests with.
# Already in the graph under reqwest. On Android it needs its JVM init (rustls_platform_verifier::android).
rustls-platform-verifier = "0.7"
# The query strings the desktop and mobile client reads and writes (crates/moqui-client offline, sync). Already in the
# graph under reqwest.
url = "2"
# TLS acceptor for the public HTTPS listener. aws-lc via the rustls entry above; ring stays off.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# The public key of a presented certificate, which the edge link pins (moqui-host tls_pin.rs). Already in the graph
# under rustls; no crypto provider of its own.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
# Self-signed cluster certificate. ring and pem stay off. aws-lc-rs is the crypto provider.
# x509-parser and fips stay off. time is certificate validity only; clocks stay jiff.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# Default feature is chrono. Quartz parsing uses jiff.
croner = { version = "4", default-features = false, features = ["jiff"] }
# No std feature on 0.6. Defaults are alloc, getrandom, and password-hash.
argon2 = { version = "0.6", features = ["password-hash"] }
csv = "1"
# html only. The default set also links getopts for the crate's CLI.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tracing = "0.1"
# The live log filter and telemetry settings read on each span and callsite (plans/archive/Monitor-Settings.md). Already
# in the graph (MIT OR Apache-2.0).
arc-swap = "1.9"
# Direct SDK instrumentation; no tracing bridge. gRPC is only the receiver, under moqui-host's `grpc`.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14"
# The OTLP/gRPC receiver (moqui-host `grpc` feature): the server half only; opentelemetry-proto's gen-tonic has the services.
tonic = { version = "0.14", default-features = false, features = ["server", "router", "gzip"] }
# The edge link's generated gRPC code (moqui-host `edge` feature, plans/Edge-Node.md §5.6): its protobuf codec.
tonic-prost = { version = "0.14", default-features = false }
# The edge link's code generation, dev-dependencies only: the generated code is checked in, and a test regenerates it
# with MOQUI_REGENERATE_PROTO=1. protox is a protobuf compiler in Rust, so no protoc is needed.
tonic-prost-build = { version = "0.14.9", default-features = false }
protox = "0.10"
# CSPRNG for CHANGEME secrets written to runtime/.env. No /dev/urandom.
getrandom = { version = "0.4", features = ["std"] }
# The script engine, in safe Rust (plans/Script-Engine-Oxide.md). The moqui fork, by exact revision;
# local work on the fork patches it to ../quickjs-oxide outside committed files. Declares rust-version 1.99.
quickjs-oxide = { git = "https://github.com/moqui/quickjs-oxide", rev = "7cf1f530fd47c58dfcdeca7f4160e78cb259785a", default-features = false }
# 0.156.0 declares rust-version 1.97.0.
oxc_parser = "0.156"
# The parser's arena, kept per thread and reset after each parse. Already in the tree under oxc_parser.
oxc_allocator = "0.156"
# The ESTree JSON of a parsed expression, for the server-static compatibility walk. Already in the tree under oxc_parser.
oxc_ast = { version = "0.156", features = ["serialize"] }
# Spans of parsed nodes, for the test harness power-assert rewrite. Already in the tree under oxc_parser.
oxc_span = "0.156"
# HTML cleaning for allow-html="safe" service parameters. MIT OR Apache-2.0. Builder::default() is the
# conservative maintained allow-list; there is no custom list in this repo.
ammonia = "4"
# HTML to terminal text for the tui render mode. The version ammonia already locks.
html5ever = "0.40"
# The xlsx render mode (the moqui-poi port). Defaults are empty; dates are written as Excel serial numbers, so the
# chrono and jiff features stay off. Its zip dependency is `deflate` (zopfli and flate2 on zlib-rs).
rust_xlsxwriter = { version = "0.102", default-features = false }
# read#Spreadsheet: xlsx, xlsm, xlsb, xls, and ods. Defaults are empty; chrono (dates) stays off, dates are read as
# Excel serial numbers. Shares zip with rust_xlsxwriter.
calamine = { version = "0.37", default-features = false }
# Zip data files for the entity data loader and writer. The zip and deflate (flate2 on zlib-rs) that calamine and
# rust_xlsxwriter already build; zip64 is part of the crate.
zip = { version = "9.1", default-features = false, features = ["deflate"] }
# The moqui-image port. Defaults (rayon, and every format including avif and exr) stay off; these are the formats the
# Java component read and wrote through ImageIO and TwelveMonkeys, less wbmp and SVG.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

# Line diffs for DbResource version history (stored reverse deltas) and the version compare view. Apache-2.0, no
# required dependencies; `inline` is the word-level highlight of a changed line.
similar = { version = "3.2", default-features = false, features = ["text", "inline"] }
# The Yjs CRDT, wire-compatible with the Yjs of the browser editor (m-coedit): co-edited documents (moqui-collab).
yrs = { version = "0.28", default-features = false }
# Git resource locations (git://, crates/moqui-git). gitoxide is pure Rust; libgit2 (git2) fails the
# license gate and links OpenSSL. Defaults stay off; HTTPS fetch goes through the workspace reqwest 0.13 on rustls
# (aws-lc). No push upstream yet, SSH remotes run the system ssh binary.
gix = { version = "0.90", default-features = false, features = [
    "sha1",
    "parallel",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "merge",
] }
# The dev file watcher (crates/moqui-core/src/devtools/watch.rs, the devtools feature): inotify, FSEvents and
# ReadDirectoryChangesW behind one API. CC0-1.0.
notify = { version = "8.2" }
# The pack writer (data::output, the `generate` feature) and a delta-base cache for the git server
# (crates/moqui-git/src/server): gix reaches gix-pack without either. The version moves with gix's.
gix-pack = { version = "0.77", default-features = false, features = ["generate", "pack-cache-lru-dynamic"] }
# gzip request bodies of the git server (git compresses an upload-pack request over 1 KB). Already in the graph
# through russh and zip; the miniz_oxide backend.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# --- moqui-host ---
# rt-multi-thread is for axum. The database clients are blocking and use no runtime (crates/moqui-host/src/db).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
# Defaults are tls-native-tls and theseus. No feature downloads or bundles the archive: crates/moqui-host/build.rs
# stages it and db/embedded.rs unpacks it, so the crate's build script links no TLS stack.
postgresql_embedded = { version = "0.22", default-features = false, features = ["blocking"] }
# Unpacking the staged Postgres archive (crates/moqui-host/build.rs, db/embedded.rs). Already in the graph under
# postgresql_embedded. xattr stays off.
tar = { version = "0.4", default-features = false }
# The Postgres wire protocol (message encoding and parsing, SCRAM) and its type oids, for moqui-host's blocking client.
# Values are encoded and decoded by moqui-host, so no type features.
postgres-protocol = "0.6"
postgres-types = { version = "0.2", default-features = false }
fallible-iterator = "0.2"
# minimal (not minimal-rust) links system zlib. On this crate rustls-tls means aws-lc.
# time and chrono stay off. rustls-tls still pulls webpki 0.22, which pulls ring.
socket2 = "0.6"
mysql = { version = "28", default-features = false, features = [
    "minimal-rust",
    "derive",
    "buffer-pool",
    "rustls-tls",
    "rust_decimal",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
# The 0.6 line reqwest 0.13 also links; 0.7 would be a second tower-http.
tower-http = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "fs",
    "set-header",
] }
# The plain listener serves each connection itself so hyper has a timer for its header read timeout (axum::serve sets
# none). Both are already in the graph under axum with these features.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http1"] }
# The PDF browser's DevTools socket (crates/moqui-host/src/pdf). Already in the graph under axum's ws feature; it moves
# with axum's (0.30 would be a second tungstenite).
# chromiumoxide was the plan; its untagged-enum message parsing fails under serde_json arbitrary_precision.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
# The tui remote client's /notws socket and the test client: the same 0.29 handshake set axum's ws feature links. No
# native-tls and no rustls.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# SSH client and server. ring, des, and dsa stay off. aws-lc-rs matches the other TLS crates.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
# SFTP v3 subsystem. No dependency on russh; the host feeds it the channel bytes.
russh-sftp = "3"
# huskarl's HTTP request and body types, and the form encoding of the SSO callback. Already in the graph under it.
http = "1"
bytes = "1"
form_urlencoded = "1"
# Apple's client secret JWT (ES256). The same p256 huskarl-crypto-native and russh link.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
# OIDC and OAuth 2 client. Default feature is the native JWS verifier.
# Loopback, metrics, and the experimental key-binding feature stay off.
huskarl = "0.11"
# Web Push (RFC 8291 payload encryption, RFC 8292 VAPID) in moqui-core's web-push feature: P-256 ECDH and ES256 from the
# p256 above, HKDF-SHA-256 and AES-128-GCM. The same RustCrypto generation as p256 0.14; web-push-native was set aside
# as it links a second p256 (0.13), aes-gcm 0.10 and jwt-simple.
hkdf = "0.13"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# IPP message encoding for network printing (the moqui-cups port). The clients stay off, so the request goes through
# the async reqwest above on the edge runtime; no second HTTP stack.
ipp = { version = "8", default-features = false }

# WebRTC for calls (moqui-rtc, plans/Comms-Framework.md §6.2, D-W1): sans-IO ICE-lite, DTLS-SRTP, simulcast, TWCC.
# default-features off leaves out its examples (rouille); aws-lc-rs is the crypto rustls already links.
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"] }
# The embedded TURN server (moqui-rtc turn/, plans/Comms-Framework.md §6.5, D-W4): sans-IO, std only (no openssl); the
# host owns its listeners and relay sockets and wraps TLS with its own rustls. The client half is for the tests.
turn-server-proto = { version = "0.7.3", default-features = false, features = ["std"] }
turn-client-proto = { version = "0.7.3", default-features = false, features = ["std"] }
# SFrame (RFC 9605) for the tests of encrypted calls only (W8): moqui-rtc's tests check the RFC's vectors, which the browser's
# own SFrame (webroot js/WebrootSFrame.js) runs too, against this independent implementation. rust-crypto: the CTR suites
# as well, on the aes-gcm, hkdf, sha2, ctr and cipher already in the graph; not ring.
sframe = { version = "2.1.0", default-features = false, features = ["rust-crypto"] }
# Opus for the call audio core (moqui-rtc audio/, plans/Comms-Framework.md §6.2 "The M0 gate"): a pure-Rust port of
# libopus 1.6 with no dependencies, chosen over rusty-opus and opus-pure, and over libopus through `opus` and cmake.
opus-rs = "0.1.40"
# SIP for phone calls (moqui-sip, plans/Comms-Framework.md §5.2, "The V1 gate"): transactions, dialogs and the UDP, TCP
# and TLS transports, on Tokio. default-features off leaves out WebSocket (tokio-tungstenite) and SRV lookup
# (hickory-resolver). Its TLS turns on rustls's ring provider beside aws-lc-rs and builds its configs from the process
# default, so moqui-sip installs aws-lc-rs as that default before a TLS transport starts.
rsipstack = { version = "0.7.12", default-features = false, features = ["platform-tokio", "rustls"] }
tokio-util = { version = "0.7", default-features = false }
# XMPP for local users (moqui-xmpp, plans/Comms-Framework.md §4.3 "XMPP server (C3)", D-C3): rxml parses the client's
# stream (MIT; no DTDs, entities or processing instructions), minidom holds each stanza as an element tree and jid parses
# and prepares addresses (both MPL-2.0, used unmodified, deny.toml exceptions). The server reads and writes stanzas with
# minidom itself; tokio-xmpp (with xmpp-parsers and sasl) is the test client's only, a dev-dependency of moqui-host.
rxml = { version = "0.14", default-features = false, features = ["std"] }
minidom = "0.19"
jid = "0.12"
tokio-xmpp = { version = "6", default-features = false }
# The channel binding tokio-xmpp's connector hands its SASL client (the same release it resolves).
sasl = { version = "0.5", default-features = false }

# --- moqui-browser ---
# The browser's local database (plans/archive/Wasm.md). bundled compiles the SQLite amalgamation with the
# target C compiler, which is emcc for wasm32-unknown-emscripten. SQLite is public domain.
rusqlite = { version = "0.41", features = ["bundled"] }
