# MR Moqui with an external Postgres. Search stays the search schema on that server, so there is
# no OpenSearch container and the moqui process does not start an embedded database.
#
#   podman compose -f podman/moqui-postgres-compose.yml up -d
#
# Passwords come from podman/.env (see env.example). moqui_conf__entity_facade__datasource__TRANSACTIONAL__sslmode=disable because an empty
# sslmode asks for verified TLS, and this Postgres image does not serve TLS. A server that does
# should set verify-full and moqui_conf__entity_facade__datasource__TRANSACTIONAL__sslrootcert instead.

name: moqui

services:
  moqui:
    image: localhost/moqui:latest
    restart: unless-stopped
    init: false
    stop_grace_period: 60s
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - moqui-data:/var/lib/moqui
    environment:
      instance_purpose: production
      moqui_conf__entity_facade__crypt_pass: ${MOQUI_CRYPT_PASS:-}
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__database_conf_name: postgres
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__host: postgres
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__port: "5432"
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__database: ${MOQUI_DB_NAME:-moqui}
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__schema_name: public
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__user: ${MOQUI_DB_USER:-moqui}
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__password: ${MOQUI_DB_PASSWORD:?set MOQUI_DB_PASSWORD in podman/.env}
      moqui_conf__entity_facade__datasource__TRANSACTIONAL__sslmode: disable
      search_backend: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOQUI_DB_NAME:-moqui}
      POSTGRES_USER: ${MOQUI_DB_USER:-moqui}
      POSTGRES_PASSWORD: ${MOQUI_DB_PASSWORD:?set MOQUI_DB_PASSWORD in podman/.env}
    volumes:
      # Postgres 18 keeps its data under this directory, in a versioned subdirectory.
      - moqui-postgres:/var/lib/postgresql
    # Not published by default; uncomment to reach the database from the host (loopback only).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOQUI_DB_USER:-moqui} -d ${MOQUI_DB_NAME:-moqui}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  moqui-data:
  moqui-postgres:
