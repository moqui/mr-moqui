[package]
name = "moqui-host"
description = "Process edge: HTTP server and process spawn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that may depend on Tokio, axum, process spawn, SSH (russh, russh-sftp), and the OIDC client (huskarl);
# the sync database clients and postgresql_embedded are moqui-drivers', which this one links as `db`.

# The packages (docs/Build-Test.md) are the first four; the binary crates (crates/moqui, and target/moqui-app that
# `./moq build` generates) forward them. The default is the largest with the dev tools, so `cargo build`, `cargo test`
# and `cargo lint` cover everything.
[features]
default = ["maximal", "devtools"]
# Dev package: Lite with git hosting, the SSH server and the dev tools. Commented out: the release build (Maximal
# with the dev tools) is the default now; likely to be removed.
# dev = ["lite", "git", "ssh", "devtools"]
# Lite package (`./moq build --lite`): the web server on embedded Postgres, PDF, outbound mail, the terminal client, and
# gRPC (the cluster's transport, and the OTLP receiver when it is turned on).
lite = ["axum", "embedded-postgres", "pdf", "smtp", "tui", "llm", "test-client", "telemetry", "web-push", "backup-s3", "grpc", "vault", "manage"]
# Enterprise package (`./moq build --enterprise`): everything, with the databases external.
enterprise = ["axum", "postgres", "mysql", "pdf", "mail", "git", "image", "xlsx", "ssh", "sso", "print", "inbound-smtp", "tui", "llm", "test-client", "telemetry", "grpc", "web-push", "backup-s3", "rtc", "sip", "channels", "xmpp", "edge", "vault", "instances", "manage", "overture"]
# Maximal package (`./moq build`, the default, and the debug build), with devtools: everything, Postgres embedded.
maximal = ["enterprise", "embedded-postgres"]

# How much of the runtime is built into the binary (crates/moqui-embedded, `./moq build --embed <level>`): with
# neither, the framework level (framework, tools, a webroot stub and the confs); embed-production adds the whole webroot
# and every other base and add-on component less its tests and plans (the file set of `./moq archive`); embed-all adds
# the tests, plans and the dev and test sets. In no package; a build option.
embed-production = ["moqui-embedded/production"]
embed-all = ["moqui-embedded/all"]
# The OpenSearch and Chromium archives built in (crates/moqui-embedded/src/programs.rs), unpacked into the install
# directory and run as their own processes, as the embedded Postgres is (`./moq build --embed-opensearch`,
# `--embed-chromium`). Each is separate; in no package.
embed-opensearch = ["moqui-embedded/opensearch"]
embed-chromium = ["moqui-embedded/chromium"]

# The database drivers (crates/moqui-drivers).
embedded-postgres = ["postgres", "moqui-drivers/embedded-postgres"]
postgres = ["moqui-drivers/postgres"]
mysql = ["moqui-drivers/mysql"]
# The web listeners: HTTP/1.1, and HTTP/2 by ALPN on the HTTPS listener (WebSockets over extended CONNECT, RFC 8441).
axum = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "hyper/http2",
    "hyper-util/http2",
    "axum/http2",
    "dep:instant-acme",
]
pdf = ["dep:tokio-tungstenite", "dep:futures-util"]
# The script engine's inline-cache counters in js_speed's section reports (plans/Profiling3.md M6). A measuring build.
ic-stats = ["moqui-core/ic-stats"]
# SSH and SFTP: the SFTP client of moqui_core::sftp, the built-in SSH server (SFTP, admin shell, git over SSH), and
# the SSH cluster channel.
ssh = ["dep:russh", "dep:russh-sftp"]
# OIDC and OAuth 2 logins (moqui_core::sso).
sso = ["dep:huskarl", "dep:p256", "dep:form_urlencoded"]
# Network printing over IPP (moqui_core::print).
print = ["dep:ipp"]
# The SMTP listener for hosted and shared mail accounts behind the edge gateway (src/smtp.rs, Tokio only); it stores
# through the inbound mail of imap. It starts only when smtp-server@enabled is true. docs/interfaces/Mail-Inbound.md.
inbound-smtp = ["imap"]
# The email services (crates/moqui-mail): both halves.
mail = ["smtp", "imap"]
# Outbound SMTP: send#EmailMessage and send#EmailTemplate (password reset, notifications), test#EmailServer's SMTP step.
smtp = ["dep:moqui-mail"]
# Inbound: IMAP and POP3 poll, the mail client's sync, IDLE and import, the OAuth sign-in of mail accounts and the
# delivery of mail the SMTP listener received. Replies and the client's sends go out through SMTP, so this includes it.
imap = ["smtp", "moqui-mail/imap"]
# git:// locations, the git services and the git server (crates/moqui-git).
git = ["dep:moqui-git", "moqui-devkit/git"]
# Framework features, forwarded to moqui-core.
image = ["moqui-core/image"]
# Web Push to subscribed browsers (the PWA), in every package.
web-push = ["moqui-core/web-push"]
# The encrypted S3 mirror of the embedded database backup, in every package.
backup-s3 = ["moqui-core/backup-s3"]
xlsx = ["moqui-core/xlsx", "moqui-report/xlsx", "dep:moqui-calc"]
# Optional Overture data for Maps (crates/moqui-maps, plans/archive/Maps-Overture.md): the GeoParquet reader and the import of a
# region's Places and Buildings. In Maximal and Enterprise; not Lite.
overture = ["dep:moqui-maps"]
# The agents and the model providers (crates/moqui-llm).
llm = ["dep:moqui-llm"]
# Calls (crates/moqui-rtc, plans/archive/Comms-Framework.md §6): the media socket and its SFU (src/rtc/), and the call signaling
# on /notws (src/notws/rtc.rs). The media socket starts only when media-server@enabled is true. In Maximal, Enterprise
# and Debug; not Lite.
rtc = ["axum", "dep:moqui-rtc", "dep:turn-client-proto", "dep:if-addrs"]
# Local speech to text for call captions (Whisper on candle, plans/archive/Comms-Framework.md §6.4): not built yet, off in every
# package; src/speech_local.rs answers notBuiltIn. Captions go through the moqui-llm endpoint meanwhile.
speech-local = []
# Phone calls (crates/moqui-sip, plans/archive/Comms-Framework.md §5.2, docs/interfaces/SIP.md): the SIP engine (src/sip/), its
# trunks and the RTP of phone legs, joined to the call media. It starts only when sip-server@enabled is true. In Maximal,
# Enterprise and Debug; not Lite.
sip = ["rtc", "dep:moqui-sip"]
# Business messaging channels (crates/moqui-channels, plans/archive/Comms-Framework.md §4.3, docs/interfaces/SMS.md): the SMS chat
# bridge adapters, one for each provider (Telnyx's is sms). The /channels/ routes (src/channels.rs) are in every build with axum and answer only when
# channels@webhooks-enabled is true; without this feature no adapter answers them. In Maximal and Enterprise; not Lite.
channels = ["dep:moqui-channels"]
# XMPP for local users (crates/moqui-xmpp, plans/archive/Comms-Framework.md §4.3 C3a, docs/interfaces/XMPP.md): the listeners
# (src/xmpp/), /xmpp-websocket and /xmpp-upload/ on the HTTP listener. It starts only when xmpp-server@enabled is true, for
# xmpp-server@domain. In Maximal, Enterprise and Debug; not Lite.
xmpp = ["axum", "dep:moqui-xmpp"]
telemetry = ["moqui-core/telemetry"]
# gRPC (tonic) on HTTP/2: the cluster's transport (src/cluster_grpc/, plans/archive/Cluster.md), with the generated
# clients and servers of our own .proto files, and the OTLP/gRPC receiver, opened only when
# <telemetry><receiver grpc-enabled="true"> is set. In every package.
grpc = [
    "telemetry",
    "axum",
    "moqui-core/grpc",
    "dep:tonic",
    "dep:opentelemetry-proto",
    "dep:tonic-prost",
    "dep:prost",
    "tonic/codegen",
    "hyper/client",
    "hyper-util/service",
]
# The edge link (plans/archive/Edge-Node.md §5.1, src/edge_link/): the local node's dialer when edge/node@url is set, and on an
# edge node (instance@node-role front_edge) the ALPN moqui-edge/1 hand-off on the HTTPS listener; gRPC both ways on HTTP/2. In Maximal
# and Enterprise, whose graph already has all of it (§5.6); not Lite.
edge = ["grpc", "dep:webpki-roots", "dep:sha1"]
# Vaults (crates/moqui-vault-server, plans/archive/Vault-Instances.md §3): personal and operational vaults, leases, machine
# access and recovery. In every package.
vault = ["dep:moqui-vault-server", "dep:moqui-vault"]
# Managed instances (crates/moqui-instance, plans/archive/Vault-Instances.md §4): kinds, provisioning on Docker and Podman hosts,
# deploys, rotation and transit by the manager. In Maximal and Enterprise; not Lite.
instances = ["vault", "dep:moqui-instance"]
# The manager link (src/manage_link/, plans/archive/Vault-Instances.md §4.4): a managed instance dials its manager on ALPN
# moqui-manage/1, gRPC both ways on HTTP/2; with instances, the manager's end on the HTTPS listener. The bootstrap
# bundle is HPKE and the approver set Ed25519 (moqui-vault). In every package, so any build can be managed.
manage = ["grpc", "dep:moqui-vault"]
# What only development needs (plans/archive/design-dev-aide.md 3.3): the framework's file watcher, and in the binary crates the
# components/dev crates. In the Maximal (default) and Debug packages; not in Lite or Enterprise.
devtools = ["moqui-devkit/watch", "dep:lsp-server", "dep:lsp-types"]
# The terminal client (`moqui tui`, plans/archive/Screen-TUI-Impl.md 4.6): in every package, so it compiles Revue; lite has it
# for a quick terminal loop while developing and testing.
# Its remote client (`moqui tui --server`) takes pushed notifications from `/notws` over tungstenite, with the web's
# root certificates for https, and keeps the connection's session cookies in memory (reqwest's cookie jar: cookie_store
# and publicsuffix are new to the graph) so one-time session values survive redirects.
tui = ["dep:moqui-tui", "dep:tungstenite", "dep:webpki-roots", "reqwest/cookies"]
# `moqui test-client` (plans/archive/ClientTestHarness.md): a component's test/client specs against a running server, over
# HTTP (the host's reqwest), raw TCP or TLS and WebSocket (tungstenite, as tui has it), with no database or listener.
# In every package, so a CI box with any binary can test any server.
test-client = ["dep:tungstenite", "dep:webpki-roots", "dep:regex", "dep:getrandom", "dep:url"]

[dependencies]
# The workspace entry has default features off (moqui-browser). The host always has HTTP and the cluster
# certificate; the other core features follow the host's own.
moqui-core = { workspace = true, features = ["http", "cluster-tls"] }
moqui-lib = { workspace = true, features = ["http"] }
moqui-llm = { workspace = true, optional = true }
moqui-git = { workspace = true, optional = true }
moqui-mail = { workspace = true, optional = true }
# Reports, dashboards, alerts and monitoring keys (crates/moqui-report), in every build.
moqui-report = { workspace = true }
# Co-edited documents (crates/moqui-collab), in every build; the notification WebSocket carries their sync.
moqui-collab = { workspace = true }
# The Tools app's database services (crates/moqui-tools), in every build.
moqui-tools = { workspace = true }
# CalcGrid, database-driven spreadsheets on the IronCalc engine (crates/moqui-calc), under the xlsx feature.
moqui-calc = { workspace = true, optional = true }
# Optional Overture data for Maps (crates/moqui-maps), under the overture feature.
moqui-maps = { workspace = true, optional = true }
# Calls: the SFU on str0m (crates/moqui-rtc), under the rtc feature.
moqui-rtc = { workspace = true, optional = true }
# The edge wizard's TURN check, a browser's allocation on the edge node's TURN (src/rtc/turn_probe.rs), under rtc: sans-IO,
# on the stun-proto and turn-types that turn-server-proto already brings.
turn-client-proto = { workspace = true, optional = true }
# The host's interface addresses for the TURN server's XMPP rule (SEC-COM-18); already in the graph through rsipstack.
if-addrs = { workspace = true, optional = true }
# Phone calls: the SIP user agent and B2BUA (crates/moqui-sip), under the sip feature.
moqui-sip = { workspace = true, optional = true }
# Business messaging channels: the SMS adapter (crates/moqui-channels), under the channels feature.
moqui-channels = { workspace = true, optional = true }
# XMPP for local users (crates/moqui-xmpp), under the xmpp feature.
moqui-xmpp = { workspace = true, optional = true }
# The DAV server, the VCard and ICalendar tools and elFinder (crates/moqui-dav), in every build; /dav/ and SFTP serve it.
moqui-dav = { workspace = true }
# Vaults (crates/moqui-vault-server) under the vault feature, managed instances (crates/moqui-instance) under the
# instances feature.
moqui-vault-server = { workspace = true, optional = true }
# The vault crypto's client session (ops::Session), natively, for `moqui vault` and the test client's vault member.
moqui-vault = { workspace = true, optional = true, features = ["json"] }
moqui-instance = { workspace = true, optional = true }
# The runtime files built into the binary (crates/moqui-embedded), in every build; the embed-* features add to them.
moqui-embedded = { workspace = true }
# The development kit (crates/moqui-devkit), in every build: moqui test, lint, check and types; its file watcher is the
# devtools feature's.
moqui-devkit = { workspace = true }
# The database drivers (crates/moqui-drivers), as `db`; the postgres, mysql and embedded-postgres features turn on its own.
moqui-drivers = { workspace = true }
# `ui` pulls Revue. The `tui` feature above links it.
moqui-tui = { workspace = true, optional = true, features = ["ui"] }
tungstenite = { workspace = true, optional = true }
# The seed of a load user's pause generator, in moqui test-client: already in the graph through moqui-lib.
getrandom = { workspace = true, optional = true }
tracing = { workspace = true }
# the web protection conf a conf reload replaces (plans/archive/Component-Deploy.md)
arc-swap = { workspace = true }
# `moqui lsp` (plans/archive/design-dev-aide.md 13.6, F13): the Language Server Protocol's messages and its stdio transport, as
# rust-analyzer uses them; under devtools.
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
# Log line and log entry timestamps (crates/moqui-host/src/logging.rs). Already in the graph under moqui-lib.
jiff = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
# The ACME client of System › Certificates (src/acme, plans/Edge-Node2.md §4.8), with the HTTPS listener (axum).
instant-acme = { workspace = true, optional = true }
sha2 = { workspace = true }
# Passphrases and shares on the operator socket and in `moqui operator` (src/operator, plans/Sealed-Secrets.md §3.3).
zeroize = { workspace = true }
# A pool member's own key, which signs its edge link Hello (src/edge_link/member_key.rs, plans/Edge-Node2.md §4.11):
# the crypto rustls already links.
aws-lc-rs = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
# The WebSocket accept key of a forwarded upgrade on an edge node (src/edge_link/web.rs). Already in the graph.
sha1 = { workspace = true, optional = true }
base64 = { workspace = true }
serde_json = { workspace = true }
# The OTLP receiver's gzip (telemetry), and unpacking the OpenSearch and Chromium built in (src/embedded_programs.rs).
# Both already in the graph.
flate2 = { workspace = true }
tar = { workspace = true }
webpki-roots = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
# The public key of a presented certificate (src/tls_pin.rs). Already in the graph under rustls.
webpki = { workspace = true }
opentelemetry-proto = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
huskarl = { workspace = true, optional = true }
http = { workspace = true }
bytes = { workspace = true }
form_urlencoded = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
reqwest = { workspace = true }
# A page problem that allowProblems ignores, in moqui test-client: already in the graph through moqui-tui.
regex = { workspace = true, optional = true }
# The load runner's target check (src/load_runner/targets.rs) parses URLs as reqwest does (WHATWG): already in the
# graph through reqwest.
url = { workspace = true, optional = true }
ipp = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# setsid and dup2 for `moqui serve`. Already in the graph (MIT OR Apache-2.0).
libc = "0.2"
# The browser terminal's host sessions (src/term/exec.rs, plans/archive/Terminal-Fancy.md §7.2): a pseudo-terminal, its
# window size, and the session leader of `moqui term-exec`. A workspace dependency already; these features add no crate.
rustix = { workspace = true, features = ["pty", "process", "termios", "fs"] }

[lints]
workspace = true

[dev-dependencies]
# A browser stand-in for the call tests (tests/it/rtc.rs): a str0m client peer.
str0m = { workspace = true }
# A relayed browser stand-in for the TURN test (tests/it/rtc.rs).
turn-client-proto = { workspace = true }
# The fake trunk's SIP messages (tests/it/sip.rs).
rsipstack = { workspace = true }
# The XMPP client of tests/it/xmpp.rs (MPL-2.0, D-C3; with xmpp-parsers and sasl): stanzas, SASL and stream management
# against the server, as an independent implementation. default-features off: no DNS or connectors of its own.
tokio-xmpp = { workspace = true }
sasl = { workspace = true }
# The edge link's code generation (src/edge_link/proto/, plans/archive/Edge-Node.md §5.6): a test regenerates the checked-in
# code with MOQUI_REGENERATE_PROTO=1, and otherwise checks that it matches. No protoc.
tonic-prost-build = { workspace = true }
protox = { workspace = true }
# the dev-aide component's services, for the tests of tests/it/devaide.rs
dev-aide = { workspace = true }
# A request's frame on the test's thread (moqui_core::screen::gate::with_request_frame): a header login's request, for
# the refusals of tests/it/devaide_group.rs.
moqui-core = { workspace = true, features = ["test-support"] }
indexmap = { workspace = true }
# The entity model the definition_speed test builds.
moqui-db = { workspace = true }
# The example component (runtime/components/dev/example) loads on a dev instance and in the gate runtimes
# (tests/common), and its MoquiConf.xml selects a tool factory, so a test that boots it (tests/it, gate3,
# gate3_browser, search_logs_postgres) links the crate as the default (Maximal) binary does.
example = { workspace = true }
# Read back the xlsx render and the converted images in tests/tool_components.rs.
calamine = { workspace = true }
image = { workspace = true }
tungstenite = { workspace = true }
# A browser editor's Yjs document in tests/it/collab.rs.
yrs = { workspace = true }

# Out of the default `cargo test`: each test boots its own embedded Postgres and seed, and the browser
# tests drive Chromium. Run them by name: `cargo test -p moqui-host --test gate3 --test gate3_browser`.
[[test]]
name = "gate3"
test = false

# About 3 minutes: an acceptance test of the framework (docs/Build-Test.md "The two suites"), run by ./moq accept-all.
[[test]]
name = "gate3_browser"
test = false

# The browser of moqui test-client over the gallery screens, opt-in as gate3_browser is because it needs Chromium:
# `cargo test -p moqui-host --test client_browser`.
[[test]]
name = "client_browser"
test = false

# Opt-in search benchmarks over a generated corpus. Not linked by a default `cargo test`.
# SEARCH_BENCH_DOCS=100000 cargo test --release -p moqui-host --test search_bench -- --ignored --nocapture
[[test]]
name = "search_bench"
test = false

# Opt-in real-store and transport timings of the monitoring HTTP boundary (plans/archive/Monitoring.md). Not linked by a
# default `cargo test`. cargo test --profile release -p moqui-host --test monitor_performance -- --ignored --nocapture
[[test]]
name = "monitor_performance"
test = false

# Opt-in entity facade timings. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test entity_speed -- --ignored --nocapture
[[test]]
name = "entity_speed"
test = false

# Opt-in service facade timings, the service calls of Tools/Database/SpeedTest.xml. Not linked by a default
# `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test service_speed -- --ignored --nocapture
[[test]]
name = "service_speed"
test = false

# Opt-in transaction cache timings: the candidates of plans/archive/TX-Cache.md with the cache off and on. Not linked by a
# default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test tx_cache_speed -- --ignored --nocapture
[[test]]
name = "tx_cache_speed"
test = false

# Opt-in entity data loader timings: generated XML, CSV and JSON files and the framework data. Not linked by a
# default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test data_load_speed -- --ignored --nocapture
[[test]]
name = "data_load_speed"
test = false

# Opt-in MNode parse and read timings over the runtime XML files. No database. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test xml_speed -- --ignored --nocapture
[[test]]
name = "xml_speed"
test = false

# Opt-in definition load timings: the entity model, service and screen definitions. No database. Not linked by a
# default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test definition_speed -- --ignored --nocapture
[[test]]
name = "definition_speed"
test = false

# Opt-in startup timings: a first start on an empty embedded database, restarts on it, and the factory boot alone. Not
# linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test startup_speed -- --ignored --nocapture
[[test]]
name = "startup_speed"
test = false

# Opt-in script timings: QuickJS expressions, scripts, XML actions, services, templates and screens, and what an engine
# costs a thread. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test js_speed -- --ignored --nocapture
[[test]]
name = "js_speed"
test = false

# Scripted Gallery and Party screens on embedded Postgres, run by scripts/check-packages.sh:
# `cargo test -p moqui-host --test tui_screens`.
[[test]]
name = "tui_screens"
required-features = ["tui"]
test = false
