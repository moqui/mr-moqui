[package]
name = "moqui-host"
description = "Process edge: HTTP server, database drivers, and process spawn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that may depend on Tokio, axum, the sync database clients,
# postgresql_embedded, process spawn, SSH (russh, russh-sftp), and the OIDC client (huskarl).

[features]
default = ["embedded-postgres", "postgres", "mysql", "axum", "pdf"]
embedded-postgres = ["dep:postgresql_embedded"]
postgres = ["dep:postgres", "dep:tokio-postgres-rustls"]
mysql = ["dep:mysql"]
axum = ["dep:axum", "dep:tower", "dep:tower-http", "dep:hyper", "dep:hyper-util"]
pdf = ["dep:tokio-tungstenite", "dep:futures-util"]
# MPL-2.0. Not in the default binary. `cargo tree -p moqui-host -F pdf-servo`.
pdf-servo = ["dep:servo"]
# No crate. OpenSearch is a separate process, reached through the core HTTP client.
opensearch = []
# No crate. Inbound SMTP is not chosen.
inbound-smtp = []

[dependencies]
# The workspace entry has default features off (moqui-browser); the server wants all three.
moqui-core = { workspace = true, features = ["mail", "http", "cluster-tls"] }
moqui-lib = { workspace = true, features = ["http"] }
tracing = { workspace = true }
# Log line and log entry timestamps (crates/moqui-host/src/logging.rs). Already in the graph under moqui-lib.
jiff = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
postgresql_embedded = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
mysql = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
servo = { workspace = true, optional = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
huskarl = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
form_urlencoded = { workspace = true }
p256 = { workspace = true }
reqwest = { workspace = true }
ipp = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
indexmap = { workspace = true }
# Read back the xlsx render and the converted images in tests/tool_components.rs.
calamine = { workspace = true }
image = { workspace = true }
# Same 0.29 handshake set axum's ws feature already links. No native-tls and no rustls.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# Out of the default `cargo test`: each test boots its own embedded Postgres and seed, and the browser
# tests drive Chromium. Run them by name: `cargo test -p moqui-host --test gate3 --test gate3_browser`.
[[test]]
name = "gate3"
test = false

[[test]]
name = "gate3_browser"
test = false
