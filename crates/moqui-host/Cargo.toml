[package]
name = "moqui-host"
description = "Process edge: HTTP server, database drivers, and process spawn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that may depend on Tokio, axum, the sync database clients,
# postgresql_embedded, process spawn, SSH (russh, russh-sftp), and the OIDC client (huskarl).

# The packages (docs/Build-Test.md) are the first four; the binary crates (crates/moqui, and target/moqui-app that
# `./moq build` generates) forward them. The default is the largest with the dev tools, so `cargo build`, `cargo test`
# and `cargo lint` cover everything.
[features]
default = ["maximal", "devtools"]
# Dev package (`./moq build`, the default): Lite with git hosting, the SSH server and the dev tools.
dev = ["lite", "git", "ssh", "devtools"]
# Lite package (`./moq build --lite`): the web server on embedded Postgres, PDF, outbound mail, and the terminal client.
lite = ["axum", "embedded-postgres", "pdf", "smtp", "tui", "llm", "test-client", "telemetry"]
# Enterprise package (`./moq build --enterprise`): everything, with the databases external.
enterprise = ["axum", "postgres", "mysql", "pdf", "mail", "git", "image", "xlsx", "ssh", "sso", "print", "inbound-smtp", "tui", "llm", "test-client", "telemetry"]
# Maximal package (`./moq build --release`, and the debug build): everything, Postgres embedded.
maximal = ["enterprise", "embedded-postgres"]

embedded-postgres = ["postgres", "dep:postgresql_embedded", "dep:tar", "dep:flate2"]
postgres = ["dep:postgres-protocol", "dep:postgres-types", "dep:fallible-iterator", "dep:webpki-roots"]
mysql = ["dep:mysql"]
axum = ["dep:axum", "dep:tower", "dep:tower-http", "dep:hyper", "dep:hyper-util", "dep:futures-util"]
pdf = ["dep:tokio-tungstenite", "dep:futures-util"]
# SSH and SFTP: the SFTP client of moqui_core::sftp, the built-in SSH server (SFTP, admin shell, git over SSH), and
# the SSH cluster channel.
ssh = ["dep:russh", "dep:russh-sftp"]
# OIDC and OAuth 2 logins (moqui_core::sso).
sso = ["dep:huskarl", "dep:p256", "dep:form_urlencoded"]
# Network printing over IPP (moqui_core::print).
print = ["dep:ipp"]
# The SMTP listener for hosted and shared mail accounts behind the edge gateway (src/smtp.rs, Tokio only); it stores
# through the inbound mail of imap. It starts only when smtp_listen_port is set. docs/interfaces/Mail-Inbound.md.
inbound-smtp = ["imap"]
# The email services (crates/moqui-mail): both halves.
mail = ["smtp", "imap"]
# Outbound SMTP: send#EmailMessage and send#EmailTemplate (password reset, notifications), test#EmailServer's SMTP step.
smtp = ["dep:moqui-mail"]
# Inbound: IMAP and POP3 poll, the mail client's sync, IDLE and import, the OAuth sign-in of mail accounts and the
# delivery of mail the SMTP listener received. Replies and the client's sends go out through SMTP, so this includes it.
imap = ["smtp", "moqui-mail/imap"]
# git:// locations, the git services and the git server (crates/moqui-git).
git = ["dep:moqui-git"]
# Framework features, forwarded to moqui-core.
image = ["moqui-core/image"]
xlsx = ["moqui-core/xlsx", "moqui-report/xlsx"]
# The agents and the model providers (crates/moqui-llm).
llm = ["dep:moqui-llm"]
telemetry = ["moqui-core/telemetry", "dep:flate2"]
# What only development needs (plans/design-dev-aide.md 3.3): the framework's file watcher, and in the binary crates the
# dev-component crates. In the Dev and Debug packages; not in Lite, Maximal or Enterprise.
devtools = ["moqui-core/devtools", "dep:lsp-server", "dep:lsp-types"]
# The terminal client (`moqui tui`, plans/archive/Screen-TUI-Impl.md 4.6): in every package, so it compiles Revue; lite has it
# for a quick terminal loop while developing and testing.
# Its remote client (`moqui tui --server`) takes pushed notifications from `/notws` over tungstenite, with the web's
# root certificates for https.
tui = ["dep:moqui-tui", "dep:tungstenite", "dep:webpki-roots"]
# `moqui test-client` (plans/archive/ClientTestHarness.md): a component's test/client specs against a running server, over
# HTTP (the host's reqwest), raw TCP or TLS and WebSocket (tungstenite, as tui has it), with no database or listener.
# In every package, so a CI box with any binary can test any server.
test-client = ["dep:tungstenite", "dep:webpki-roots", "dep:regex"]

[dependencies]
# The workspace entry has default features off (moqui-browser). The host always has HTTP and the cluster
# certificate; the other core features follow the host's own.
moqui-core = { workspace = true, features = ["http", "cluster-tls"] }
moqui-lib = { workspace = true, features = ["http"] }
moqui-llm = { workspace = true, optional = true }
moqui-git = { workspace = true, optional = true }
moqui-mail = { workspace = true, optional = true }
# Reports, dashboards, alerts and monitoring keys (crates/moqui-report), in every build.
moqui-report = { workspace = true }
# `ui` pulls Revue. The `tui` feature above links it.
moqui-tui = { workspace = true, optional = true, features = ["ui"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
tracing = { workspace = true }
# `moqui lsp` (plans/design-dev-aide.md 13.6, F13): the Language Server Protocol's messages and its stdio transport, as
# rust-analyzer uses them; under devtools.
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.97", optional = true }
# Log line and log entry timestamps (crates/moqui-host/src/logging.rs). Already in the graph under moqui-lib.
jiff = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
postgresql_embedded = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
postgres-protocol = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
fallible-iterator = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
mysql = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
huskarl = { workspace = true, optional = true }
http = { workspace = true }
bytes = { workspace = true }
form_urlencoded = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
reqwest = { workspace = true }
# A page problem that allowProblems ignores, in moqui test-client: already in the graph through moqui-tui.
regex = { workspace = true, optional = true }
ipp = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# setsid and dup2 for `moqui serve`. Already in the graph (MIT OR Apache-2.0).
libc = "0.2"

# build.rs stages and checks the Postgres archive of embedded-postgres.
[build-dependencies]
tar = { workspace = true }
flate2 = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# the dev-aide component's services, for the tests of tests/it/devaide.rs
dev-aide = { workspace = true }
indexmap = { workspace = true }
# The entity model the definition_speed test builds.
moqui-db = { workspace = true }
# The example component (runtime/dev-component/example) loads on a dev instance and in the gate runtimes
# (tests/common), and its MoquiConf.xml selects a tool factory, so a test that boots it (tests/it, gate3,
# gate3_browser, search_logs_postgres) links the crate as the Dev binary does.
example = { workspace = true }
# Read back the xlsx render and the converted images in tests/tool_components.rs.
calamine = { workspace = true }
image = { workspace = true }
# Same 0.29 handshake set axum's ws feature already links. No native-tls and no rustls.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# A browser editor's Yjs document in tests/it/collab.rs.
yrs = { workspace = true }

# Out of the default `cargo test`: each test boots its own embedded Postgres and seed, and the browser
# tests drive Chromium. Run them by name: `cargo test -p moqui-host --test gate3 --test gate3_browser`.
[[test]]
name = "gate3"
test = false

# Slow (about 3 minutes, docs/Build-Test.md "Slow tests"): ./moq test-all runs it only with --slow.
[[test]]
name = "gate3_browser"
test = false

# The browser of moqui test-client over the gallery screens, opt-in as gate3_browser is because it needs Chromium:
# `cargo test -p moqui-host --test client_browser`.
[[test]]
name = "client_browser"
test = false

# Opt-in search benchmarks over a generated corpus. Not linked by a default `cargo test`.
# SEARCH_BENCH_DOCS=100000 cargo test --release -p moqui-host --test search_bench -- --ignored --nocapture
[[test]]
name = "search_bench"
test = false

# Opt-in real-store and transport timings of the monitoring HTTP boundary (plans/Monitoring.md). Not linked by a default
# `cargo test`. cargo test --profile develop -p moqui-host --test monitor_performance -- --ignored --nocapture
[[test]]
name = "monitor_performance"
test = false

# Opt-in entity facade timings. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test entity_speed -- --ignored --nocapture
[[test]]
name = "entity_speed"
test = false

# Opt-in service facade timings, the service calls of SpeedTest.xml. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test service_speed -- --ignored --nocapture
[[test]]
name = "service_speed"
test = false

# Opt-in entity data loader timings: generated XML, CSV and JSON files and the framework data. Not linked by a
# default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test data_load_speed -- --ignored --nocapture
[[test]]
name = "data_load_speed"
test = false

# Opt-in MNode parse and read timings over the runtime XML files. No database. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test xml_speed -- --ignored --nocapture
[[test]]
name = "xml_speed"
test = false

# Opt-in definition load timings: the entity model, service and screen definitions. No database. Not linked by a
# default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test definition_speed -- --ignored --nocapture
[[test]]
name = "definition_speed"
test = false

# Opt-in startup timings: a first start on an empty embedded database, restarts on it, and the factory boot alone. Not
# linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test startup_speed -- --ignored --nocapture
[[test]]
name = "startup_speed"
test = false

# Opt-in script timings: QuickJS expressions, scripts, XML actions, services, templates and screens, and what an engine
# costs a thread. Not linked by a default `cargo test`.
# CARGO_PROFILE_RELEASE_DEBUG=1 cargo test --release -p moqui-host --test js_speed -- --ignored --nocapture
[[test]]
name = "js_speed"
test = false

# Scripted Gallery and Party screens on embedded Postgres, run by scripts/check-packages.sh:
# `cargo test -p moqui-host --test tui_screens`.
[[test]]
name = "tui_screens"
required-features = ["tui"]
test = false
