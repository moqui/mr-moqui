// The PASS authority's operations over gRPC (plans/Edge-Node.md §5.5): what mr-pass sends to the Mantle authority
// instead of its REST routes, on the authority's gRPC listener (direct, with the client's secret in metadata) or down
// the edge link from the edge node to its local node (the link is the client).
//
// One generic operation, with the input and the result as JSON, as PASS's operations are one input map and one result
// map today (decision 7). Typed messages per operation may come later, for efficiency or for what they make possible,
// perhaps generated by `moqui types`; they would be new RPCs beside these.
//
// Changes are additive only: a new field or RPC gets a new number or name, and none is removed, renamed or renumbered.
//
// The Rust code in crates/moqui-host/src/pass_authority/proto/ is generated from this file and checked in:
//   MOQUI_REGENERATE_PROTO=1 cargo test -p moqui-host --lib pass_authority::proto

syntax = "proto3";

package moqui.pass.v1;

service PassAuthority {
  // One operation: a schema operation (getSiteInfo, createTopic, ...) or an account action (account.session, ...).
  rpc Call(PassCall) returns (PassResult);
  // A protected file (getAttachment, getExport): the first part is its metadata or the error, then its bytes.
  rpc Download(PassCall) returns (stream DownloadPart);
  // An operation with a file (stageAttachment, submitSupplierBill): the call first, then the file's metadata, then its
  // bytes, at most 10 MiB.
  rpc Upload(stream UploadPart) returns (PassResult);
}

message PassCall {
  // The operation: a name in mr-pass Schema.js, or account.<action> (session, challenge, registration, verification,
  // recovery, logout, security, sso-prepare, sso-exchange).
  string operation = 1;
  string site_id = 2;
  // The input, a JSON object (UTF-8).
  bytes input_json = 3;
  // The visitor's delegated credential (the REST API's Bearer), when signed in.
  string delegation = 4;
  // The visitor's address, for the authority's rate limits only; never trusted for authorization.
  string visitor_address = 5;
  // An id for the call, in both ends' logs.
  string operation_id = 6;
  // The authority session of an account flow in progress (the second factor), as the last result gave it.
  string session_handle = 7;
  // The registered client, on the direct listener only; its secret is the x-pass-client-secret metadata. On the edge
  // link the link is the client and this is ignored.
  string client_id = 8;
}

// The REST API's error envelope.
message PassError {
  // The kind: AuthenticationRequired, Unauthorized, NotFound, Conflict, Unprocessable, Tarpit, Unavailable.
  string code = 1;
  string message = 2;
  repeated FieldError field_errors = 3;
  string correlation_id = 4;
  // The HTTP status the REST API answers with for this kind (401, 403, 404, 409, 422, 429, 503).
  uint32 status = 5;
}

message FieldError {
  string field = 1;
  string message = 2;
}

message PassResult {
  // The result, a JSON object (UTF-8), when there is no error. An account action's credential is in it, as in the
  // REST API's answer.
  bytes result_json = 1;
  PassError error = 2;
  // The authority session after an account action (new when the authority rotated it), to send with the next one.
  string session_handle = 3;
}

message DownloadMeta {
  string content_type = 1;
  string filename = 2;
  // The length in bytes, 0 when not known.
  uint64 length = 3;
  // attachment or inline.
  string disposition = 4;
}

message DownloadPart {
  oneof part {
    DownloadMeta meta = 1;
    bytes chunk = 2;
    PassError error = 3;
  }
}

message UploadFile {
  string filename = 1;
  string content_type = 2;
  uint64 length = 3;
}

message UploadPart {
  oneof part {
    PassCall call = 1;
    UploadFile file = 2;
    bytes chunk = 3;
  }
}
