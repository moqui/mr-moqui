// The manager link (plans/Vault-Instances.md §4.4, crates/moqui-host/src/manage_link/): a managed instance dials its
// manager's HTTPS port with ALPN moqui-manage/1 and keeps one connection open, on which it is the HTTP/2 client of
// Manager. The manager's calls of the instance go down the Serve stream. Both keys are pinned by SHA-256 of their public
// keys. Changes are additive only; a change that cannot be is a new link version.

syntax = "proto3";

package moqui.manage.v1;

// On the manager. A pairing connection (role P) serves Pair alone; a link connection (role U) the rest. While the
// instance's last Hello or Status says sealed, only Hello, Status, Bootstrap, Unseal and SealedShares (unseal by
// recovery shares) are answered.
service Manager {
  // Pair with the one-time token a provision gave the instance as a file, or a code made in System › Instances.
  rpc Pair(PairRequest) returns (PairReply);
  // The first call of a link connection: the instance's status, the manager's answer with the link's generation.
  rpc Hello(HelloRequest) returns (HelloReply);
  // The instance's status, as it changes and every so often.
  rpc Status(InstanceStatus) returns (StatusReply);
  // The bootstrap bundle on a first start, sealed to the bundle key the instance pinned at pairing.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapReply);
  // Unseal by transit (M6): the root key wrapped to the instance's transit key, opened by the manager with that key and
  // sealed to the ephemeral key the instance made for this unseal; under the approval policy it waits for a member.
  rpc Unseal(UnsealRequest) returns (UnsealReply);
  // Unseal by recovery shares (M6): the key a sealed instance made for this unseal, signed with its link key, and the
  // shares its holders sealed to it since. The manager relays ciphertext only.
  rpc SealedShares(SealedSharesRequest) returns (SealedSharesReply);
  // The recovery holders' public keys, each with the key checks of it (M6).
  rpc Holders(HoldersRequest) returns (HoldersReply);
  // The recovery shares, each sealed to one holder and signed with the link key, as deliveries (M6).
  rpc Shares(SharesRequest) returns (SharesReply);
  // The holders' confirmations of a share set, each signed with the holder's key (M6).
  rpc ShareConfirmations(ShareConfirmationsRequest) returns (ShareConfirmationsReply);
  // A rotate-root's new unsealed proof key, signed by the old one, with the new transit wrap (M6).
  rpc RotateProof(RotateProofRequest) returns (RotateProofReply);
  // An event of the instance: started, unsealed, failed. Only while unsealed.
  rpc Event(EventRequest) returns (EventReply);
  // The manager's calls of the instance: each Command down, each CommandReply up. Only while unsealed.
  rpc Serve(stream CommandReply) returns (stream Command);
}

message InstanceStatus {
  string binary_version = 1;
  // sealed, unsealing or unsealed
  string seal_state = 2;
  // the schema hash of its entity definitions, empty while sealed
  string schema_hash = 3;
  repeated string cluster_members = 4;
  // ok, draining, starting or sealed
  string health = 5;
  bool drained = 6;
  // the instance has not stored a bootstrap bundle yet
  bool first_start = 7;
  uint32 link_version = 8;
  // the instance's unsealed proof on this link (M6): the Ed25519 key derived from its root key, and its signature over
  // the instance id, link key, generation and the Hello's challenge; empty while sealed and in Hello
  bytes proof_public = 9;
  bytes proof = 10;
  // the method its seal.json records
  string seal_method = 11;
}

message Approver {
  string user_id = 1;
  // the Ed25519 key of the approver's personal key (plans/Vault-Instances.md §3.5)
  bytes verify_public = 2;
}

// The environment's approvers as the instance pins them: unsigned at pairing, signed by an approver of the pinned set
// for every change after (moqui_vault::approvers).
message ApproverSet {
  uint64 version = 1;
  repeated Approver approvers = 2;
  bytes signer_public = 3;
  bytes signature = 4;
}

message PairRequest {
  uint32 link_version = 1;
  // the pairing token or code
  string secret = 2;
  // the X25519 public key the bootstrap bundle is sealed to, derived from the instance's link key
  bytes bundle_key = 3;
  string binary_version = 4;
}

message PairReply {
  string app_instance_id = 1;
  string environment_id = 2;
  ApproverSet approvers = 3;
  string manager_id = 4;
}

message HelloRequest {
  InstanceStatus status = 1;
}

message HelloReply {
  uint32 link_version = 1;
  string manager_id = 2;
  string app_instance_id = 3;
  uint64 generation = 4;
  // a bootstrap bundle waits for the instance
  bool bootstrap_ready = 5;
  // the X25519 key of this instance's transit on the manager, which its root key is wrapped to (M6)
  bytes transit_public = 6;
  // what the instance's unsealed proof on this link signs, with the generation
  bytes challenge = 7;
}

message StatusReply {
  // the manager takes this link's "unsealed" (M6): it unsealed the instance on it by transit, or the instance proved it
  bool unsealed_verified = 1;
}

message BootstrapRequest {}

message BootstrapReply {
  // HPKE to the pinned bundle key; empty when there is none (an instance the manager did not make)
  bytes sealed = 1;
}

message UnsealRequest {
  bytes wrapped_root = 1;
  bytes ephemeral_public = 2;
}

message UnsealReply {
  bytes sealed_root = 1;
  // empty when answered; else why it waits (the environment's approval policy)
  string waiting = 2;
}

message SealedSharesRequest {
  // the X25519 key the instance made for this unseal, and its signature by the link key (moqui_vault::managed)
  bytes unseal_public = 1;
  bytes signature = 2;
  // the link key's public half, which the manager checks against the pinned fingerprint for the holders
  bytes link_public = 3;
  // when the key stops being taken, epoch milliseconds, signed with it
  int64 expires = 4;
}

message SealedShare {
  bytes sealed = 1;
  string holder_user_id = 2;
}

message SealedSharesReply {
  repeated SealedShare shares = 1;
}

message KeyCheck {
  string checker_user_id = 1;
  string checker_key_id = 2;
  string checked_key_id = 3;
  string checked_user_id = 4;
  bytes checked_encrypt = 5;
  bytes checked_verify = 6;
  int64 checked_at = 7;
  bytes signature = 8;
}

message Holder {
  string user_id = 1;
  string personal_key_id = 2;
  bytes encrypt_public = 3;
  bytes verify_public = 4;
  // the checks of this key that the environment's approvers signed; the instance takes the key only with one by an
  // approver it pinned
  repeated KeyCheck checks = 5;
}

message HoldersRequest {}

message HoldersReply {
  repeated Holder holders = 1;
}

message ShareDelivery {
  string delivery_id = 1;
  string recipient_user_id = 2;
  string recipient_key_id = 3;
  string purpose = 4;
  bytes sealed = 5;
  bytes signature = 6;
  uint32 index = 7;
}

message SharesRequest {
  string set_id = 1;
  bytes link_public = 2;
  uint32 threshold = 3;
  repeated ShareDelivery deliveries = 4;
}

message SharesReply {}

message ShareConfirmationsRequest {
  string set_id = 1;
}

message ShareConfirmation {
  uint32 index = 1;
  string holder_user_id = 2;
  bytes signature = 3;
}

message ShareConfirmationsReply {
  repeated ShareConfirmation confirmations = 1;
}

message RotateProofRequest {
  // the new root key's proof key, its wrap to the transit key (empty for a method the manager does not unseal), and
  // the old proof key's signature over them (moqui_vault::managed::sign_rotation)
  bytes new_public = 1;
  bytes wrapped_root = 2;
  bytes signature = 3;
}

message RotateProofReply {}

message EventRequest {
  // started, unsealed or failed
  string kind = 1;
  string message = 2;
}

message EventReply {}

message StatusCommand {}
message SealCommand {}
message RestartCommand {}
message DrainCommand {
  bool drain = 1;
}
// operator secret put (plans/Sealed-Secrets.md S4)
message PutSecretCommand {
  string name = 1;
  string value = 2;
  bool force = 3;
}
// Component-Deploy's attested deploy, deploy#AttestedComponent, as the link's caller (docs/tools/Component-Deploy.md
// "The gate", M3): the attestation, signed with the secret the instance issued, stands for the permission
message DeployComponentCommand {
  string attestation = 1;
  string signature = 2;
  string data_types = 3;
}
message ExportSealCommand {}
// the surface report (Sealed-Secrets S12): answered "not built" until then
message SurfaceReportCommand {}

message Command {
  uint64 id = 1;
  oneof body {
    StatusCommand status = 2;
    SealCommand seal = 3;
    RestartCommand restart = 4;
    DrainCommand drain = 5;
    PutSecretCommand put_secret = 6;
    DeployComponentCommand deploy_component = 7;
    ExportSealCommand export_seal = 8;
    SurfaceReportCommand surface_report = 9;
    ApproverSet approvers = 10;
  }
}

message CommandReply {
  uint64 id = 1;
  bool ok = 2;
  string error = 3;
  InstanceStatus status = 4;
  // a command's text answer: the seal bundle, a deploy's report
  string text = 5;
}
