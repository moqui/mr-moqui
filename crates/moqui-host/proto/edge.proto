// The edge link between a local node and its edge node (plans/Edge-Node.md §5.1).
//
// Changes are additive only: a new field or RPC gets a new number or name, and no field or RPC is removed, renamed or
// renumbered. A change that cannot be made that way is a new link protocol version (LINK_VERSION in
// crates/moqui-host/src/edge_link/mod.rs), and the two ends refuse a link more than one version apart.
//
// The Rust code in crates/moqui-host/src/edge_link/proto/ is generated from this file and checked in:
//   MOQUI_REGENERATE_PROTO=1 cargo test -p moqui-host --lib edge_link::proto

syntax = "proto3";

package moqui.edge.v1;

// What each end says about itself, at pairing and on each new link.
message Hello {
  // The moqui binary's version (the workspace version).
  string binary_version = 1;
  // The link protocol version.
  uint32 link_version = 2;
  // The features compiled in that the other end may use: rtc, sip, xmpp, inbound-smtp, channels.
  repeated string features = 3;
  // The edge node's: the areas it offers, by name (web, mail, chat, pass); GetOffer has the details.
  repeated string capabilities = 4;
  // The edge node's: the public host names it answers for.
  repeated string public_names = 5;
  // The local node's: its instance id, which the edge node keys its rows by.
  string instance_id = 6;
  // A name to show the operator of the other end.
  string node_name = 7;
}

message ProbeRequest {}

message ProbeReply {
  Hello hello = 1;
  // The fingerprint of the edge node's link key (SHA-256 of its public key, hex), which the up and down connections
  // present: told over the pairing connection, whose web certificate WebPKI checked, so the local node can pin it.
  string link_fingerprint = 2;
}

message PairRequest {
  // The one-use code the edge node's operator made.
  string code = 1;
  Hello hello = 2;
}

message PairReply {
  Hello hello = 1;
  // The fingerprint the edge node pinned for the local node's key (SHA-256 of its public key, hex).
  string key_fingerprint = 2;
  // The fingerprint of the edge node's link key, as in ProbeReply.
  string link_fingerprint = 3;
}

message HelloRequest {
  Hello hello = 1;
}

message HelloReply {
  Hello hello = 1;
  // The link generation of this up connection; the down connection names it.
  uint64 generation = 2;
}

message PingRequest {
  // The link generation the sender is on.
  uint64 generation = 1;
}

message PingReply {
  uint64 generation = 1;
}

message UnpairRequest {}

message UnpairReply {}

// A queued item (plans/Edge-Node.md §5.2), from the sender's moqui.edge.EdgeQueueItem.
message QueueItem {
  // A UUID, which the receiver's receipt is keyed by.
  string queue_item_id = 1;
  // The receiver applies it by the service its edge queue-kind conf names for the kind.
  string kind = 2;
  string conversation_key = 3;
  string idempotency_key = 4;
  string payload = 5;
  // In a Deliver, where the receiver kept the item's content (PutContent's reply); empty when it has none.
  string content_location = 6;
  // The attempts made before this one.
  uint32 attempts = 7;
}

// A part of a queued item's content (a body too large for its payload: a message, a media file), sent before the
// item's Deliver. The receiver keeps it under a location of its own, keyed by the item's id, and the Deliver that
// follows names that location; the receiver removes it once the item is applied.
message ContentChunk {
  // The link generation the sender is on.
  uint64 generation = 1;
  // The item the content is of; the same in every chunk of one call.
  string queue_item_id = 2;
  bytes data = 3;
  // The whole content's size in bytes, on the first chunk.
  uint64 total_size = 4;
}

message PutContentReply {
  // Where the receiver keeps the content, which the item's Deliver names as its content_location.
  string content_location = 1;
}

message DeliverRequest {
  // The link generation the sender is on.
  uint64 generation = 1;
  QueueItem item = 2;
}

message DeliverReply {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Applied now, in the transaction of its receipt.
    APPLIED = 1;
    // Applied before: its receipt is there.
    DUPLICATE = 2;
    // The handler refused it or failed: the sender tries again later.
    FAILED = 3;
    // The receiver's delivery is paused: the sender tries again, not counted as an attempt.
    PAUSED = 4;
    // The receiver cannot take it now (busy, stopping, its delegate user cannot log in): tried again soon, not counted.
    UNAVAILABLE = 5;
    // The receiver has no handler or grant for the kind (a version or conf skew): tried again after 10 minutes, not
    // counted.
    NOT_HANDLED = 6;
  }
  Outcome outcome = 1;
  string error = 2;
}

// A service call the edge node runs on the local node, with the input and the result as JSON (decision 7).
message DelegateRequest {
  uint64 generation = 1;
  // The service's full name; the local node runs only the services its own edge conf delegates.
  string service = 2;
  // The parameters, a JSON object.
  string parameters_json = 3;
  // The caller on the edge node, as data and never a login: a JSON object of username and userId.
  string caller_json = 4;
  // An id for the call, in both nodes' logs.
  string operation_id = 5;
}

message DelegateReply {
  // The service's result, a JSON object, when it added no errors.
  string result_json = 1;
  // The errors the service added, or why the local node refused the call.
  repeated string errors = 2;
}

// One record of a replicated set.
message ReplicaChange {
  // The entity's full name.
  string entity_name = 1;
  // The record's key fields as text, a canonical JSON object.
  string pk_json = 2;
  // The set's fields of the record, a JSON object; empty with deleted.
  string fields_json = 3;
  bool deleted = 4;
}

// A batch of a replicated set, local node to edge node, after the commits it carries.
message ReplicateRequest {
  string set_name = 1;
  // The local node's epoch of the set: each full send starts one.
  string epoch = 2;
  // The sequence of the batch before this one in the epoch; 0 starts a full send.
  uint64 base_seq = 3;
  uint64 seq = 4;
  // Part of a full send.
  bool snapshot = 5;
  // The last part of a full send: the edge node removes the set's records of older epochs.
  bool snapshot_end = 6;
  repeated ReplicaChange changes = 7;
}

message ReplicateReply {
  // The batch does not follow the edge node's cursor (it lost its copy, or the local node restarted): send the set
  // whole, under a new epoch.
  bool resync = 1;
}

// A public host name of a local node, with how the edge node handles it (plans/Edge-Node.md §5.3).
message HostSetting {
  // Lower case, with no port or trailing dot.
  string host_name = 1;
  // EdgeHostPassthrough or EdgeHostTerminate.
  string mode = 2;
  // In a ConfigureReply, why the edge node did not take the name; empty when it did.
  string error = 3;
}

// Web access: the names the edge node answers for itself, and the modes a local node's names may have.
message WebOffer {
  repeated string public_names = 1;
  repeated string modes = 2;
}

// Mail: the MTA on the edge node (E5a, E5b).
message MailOffer {
  // The edge node takes mail for its local nodes (its SMTP listener is set up).
  bool available = 1;
  // moqui (the MTA in moqui) or postfix (Postfix and Rspamd beside it).
  string mta = 2;
  // The SMTP listener is on: smtp_listen_port is set.
  bool listener = 3;
  // The host name a local node's MX records name: smtp_hostname, else the edge node's web host name.
  string mx_host = 4;
  // The domain of the VERP bounce addresses (edge_mail_bounce_domain); empty when not set.
  string bounce_domain = 5;
  // The DKIM selector and TXT record of the edge node's key, which signs the local node's mail (moqui MTA only).
  string dkim_selector = 6;
  string dkim_record = 7;
}

// Chat bridges and SMS (E6).
message ChatOffer {
  // channels_webhooks_enabled is on: the edge node takes the bridges' webhooks.
  bool webhooks = 1;
  // The address the providers call (/channels/{chatBridgeId}/webhook under it) and the files of MMS come from.
  string public_url = 2;
}

// mr-pass on the edge node (E4).
message PassOffer {
  // mr-pass is loaded on the edge node.
  bool available = 1;
  // The PASS client id the local node registers the edge node as (pass_edge_client there).
  string client_id = 2;
}

// What an edge node offers a local node (plans/Edge-Node.md §5.7, Discover).
message Offer {
  WebOffer web = 1;
  MailOffer mail = 2;
  ChatOffer chat = 3;
  PassOffer pass = 4;
  // Areas not built on this edge node yet: calls, sip, xmpp.
  repeated string not_available = 5;
  // The edge node's public addresses (edge_public_addresses), which the local node's A and AAAA records name; empty
  // when not set, and then the addresses of its web host name are expected.
  repeated string addresses = 6;
  // The asking local node's host names on this edge node now.
  repeated HostSetting node_hosts = 7;
}

message OfferRequest {}

// The local node's part of its setup (plans/Edge-Node.md §5.7, Apply). The edge node checks it as input from any
// client: only the asking node's names are changed, and a name another node holds is refused.
message ConfigureRequest {
  // The local node's host names: with set_hosts, the whole list, so a name of this node not in it is removed.
  repeated HostSetting hosts = 1;
  // The mail domains whose MX names the edge node.
  repeated string mail_domains = 2;
  // The chat bridges whose webhooks go to the edge node.
  repeated string chat_bridge_ids = 3;
  // The PASS sites the edge node serves.
  repeated string pass_sites = 4;
  // hosts is the node's whole list; when false the node's names are left as they are.
  bool set_hosts = 5;
}

message ConfigureReply {
  // The offer after the change, with the node's host names.
  Offer offer = 1;
  // Each name of the request, with its error when it was not taken.
  repeated HostSetting hosts = 2;
}

// Served by the edge node; the local node calls it on its up connection. Probe is on a check or pairing connection and
// Pair on a pairing connection (ALPN moqui-edge-pair/1, the web certificate); the others on an up connection (ALPN
// moqui-edge/1, the link key).
service Link {
  // The edge node's Hello, before pairing, so the operator can confirm the edge node's name and fingerprint.
  rpc Probe(ProbeRequest) returns (ProbeReply);
  // Pin the key of the connection's client certificate for the local node named in the Hello.
  rpc Pair(PairRequest) returns (PairReply);
  // The first call of an up connection.
  rpc Hello(HelloRequest) returns (HelloReply);
  rpc Ping(PingRequest) returns (PingReply);
  // The local node unpairs: the edge node revokes its key and closes the link.
  rpc Unpair(UnpairRequest) returns (UnpairReply);
  // An item of the local node's outbox, applied on the edge node by its kind's handler.
  rpc Deliver(DeliverRequest) returns (DeliverReply);
  // The content of an outbox item, before its Deliver.
  rpc PutContent(stream ContentChunk) returns (PutContentReply);
  // A batch of a replicated set.
  rpc Replicate(ReplicateRequest) returns (ReplicateReply);
  // What the edge node offers this local node now.
  rpc GetOffer(OfferRequest) returns (Offer);
  // The local node's part of its setup: its host names, mail domains, chat bridges and PASS sites.
  rpc Configure(ConfigureRequest) returns (ConfigureReply);
}

message LocalHelloRequest {
  Hello hello = 1;
  // The generation of the up connection this down connection belongs to.
  uint64 generation = 2;
}

message LocalHelloReply {
  Hello hello = 1;
}

// Served by the local node on its down connection; the edge node calls it.
service LocalLink {
  rpc Hello(LocalHelloRequest) returns (LocalHelloReply);
  rpc Ping(PingRequest) returns (PingReply);
  // A queued item for the local node, applied by its kind's handler as the user _EDGE_.
  rpc Deliver(DeliverRequest) returns (DeliverReply);
  // A delegated service call, run as the user _EDGE_ with authorization.
  rpc Delegate(DelegateRequest) returns (DelegateReply);
  // The content of a queued item, before its Deliver.
  rpc PutContent(stream ContentChunk) returns (PutContentReply);
}
