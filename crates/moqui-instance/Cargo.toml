# Managed instances (plans/Vault-Instances.md §4): instance kinds (mr-moqui, postgres, mysql, opensearch),
# provisioning with secrets as files, the reconcile job, deploys to environments, rotation and the manager's transit
# keys. Core reaches it only through moqui_core::extension, which this crate fills with an inventory entry;
# moqui-host links it under its instances feature. Credentials are operational vault items (moqui-vault-server).

[package]
name = "moqui-instance"
description = "Managed instances: kinds, provisioning, deploys, rotation and transit."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moqui-core = { workspace = true }
# the container driver that CI's runs use too (moqui_lib::docker)
moqui-lib = { workspace = true, features = ["docker"] }
# leases, machine access and the server's deposits of the credentials a provision makes
moqui-vault-server = { workspace = true }
# the generated credentials and the pairing token, from the vault crate's OS randomness
moqui-vault = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
# the SCRAM-SHA-256 verifier a Postgres user is made with
hmac.workspace = true
tracing.workspace = true
zeroize.workspace = true
# the pairing token compared in constant time (link.rs)
subtle.workspace = true

[dev-dependencies]
# moqui_core::testing, the in-memory entity facade the tests open.
moqui-core = { workspace = true, features = ["test-support"] }
# the fake container engine the provisioning tests run against
moqui-lib = { workspace = true, features = ["docker", "docker-fake"] }
# the approvers' vault clients (ops::Session), as the browser module is
moqui-vault = { workspace = true, features = ["std", "json"] }

[lints]
workspace = true
