opt-level = 0
debug = true

[profile.dev.package.moqui-report]
opt-level = 0
debug = true

[profile.dev.package.moqui-collab]
opt-level = 0
debug = true

[profile.dev.package.moqui-rtc]
opt-level = 0
debug = true

[profile.dev.package.moqui-sip]
opt-level = 0
debug = true

[profile.dev.package.moqui-channels]
