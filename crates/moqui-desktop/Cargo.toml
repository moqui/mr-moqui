# The desktop app: a node in the app's own process, shown in a Tauri window (plans/Mobile-Desktop.md, configuration 2).
# Not a workspace member: Tauri and CEF stay out of the server builds and `cargo test --workspace`. `./moq desktop`
# generates target/moqui-app first, which links the framework and the component crates.

[package]
name = "moqui-desktop"
version = "0.1.0"
description = "Desktop app: an MR Moqui node in a Tauri window"
edition = "2021"
license = "CC0-1.0"
publish = false

[lib]
name = "moqui_desktop"
path = "src/lib.rs"

[[bin]]
name = "moqui-desktop"
path = "src/main.rs"

[features]
default = ["maximal"]
# The package of the node, as in crates/moqui. Maximal has the edge link and calls.
maximal = ["moqui-app/maximal"]
# The Dev package, commented out: the release build (Maximal with the dev tools) is the default now; likely to be
# removed.
# dev = ["moqui-app/dev"]
devtools = ["moqui-app/devtools"]

[dependencies]
moqui-app = { path = "../../target/moqui-app", default-features = false }
moqui-host = { path = "../moqui-host", default-features = false }
moqui-lib = { path = "../moqui-lib" }
# The client of a remote server (src/client/, plans/Mobile-Desktop.md configuration 3): accounts, sign-in, the proxy and
# the sockets.
moqui-client = { path = "../moqui-client" }
# The client's Tauri glue the mobile app shares: the shell's commands, the outbox and drafts commands, the schemes' answer.
moqui-client-tauri = { path = "../moqui-client-tauri" }
# The client's device keys in the OS key store (src/client/keystore.rs): the Keychain on macOS, the Secret Service on
# Linux (over zbus with its own executor, async-io, so it answers from any thread, the main one too; no libdbus).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
moqui-core = { path = "../moqui-core", default-features = false }
# Backup names and the last backup's time (src/backup.rs), as the framework's.
jiff = "0.2"
# The backup folder and restore dialogs (src/backup.rs). Not tauri-plugin-dialog: its script replaces window.alert
# and window.confirm on every page, the node's too. On Linux the portal, not GTK 3, which the GTK 4 app cannot load.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
serde_json = "1"
# The terminal's binary socket frames to and from the page (src/client/sockets.rs), as the workspace's.
base64 = "0.23"
# The PDF engine's timeout on the app's runtime (src/pdf.rs), the same Tokio as Tauri's.
tokio = { version = "1", features = ["time"] }
tauri = { version = "=3.0.0-alpha.5", features = ["unstable", "tray-icon"] }
# Tauri alpha5 and CEF alpha6 need dispatcher callbacks removed by tauri-runtime alpha5.
tauri-runtime = "=3.0.0-alpha.4"
# Native notifications for the page bridge (src/bridge.rs), with clicks; notify-rust under it on desktop.
tauri-plugin-notification = "=3.0.0-alpha.3"
# The webview runtime: Chromium (CEF) on every desktop OS, in place of the platform WebViews.
tauri-runtime-cef = "=3.0.0-alpha.6"
# Updates from the update feed a bundle is built with (src/updates.rs); registered only when it has one.
tauri-plugin-updater = "=3.0.0-alpha.3"
tracing = "0.1"

# SIGTERM for a sidecar node that did not stop when its stdin closed (src/node/sidecar.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# CEF's descriptors marked close-on-exec before the sidecar starts (src/node/sidecar.rs), as the workspace's.
close_fds = "0.3"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

# Its own workspace: not a member of the repository's.
[workspace]

# As in the repository's workspace and target/moqui-app: a debug build leaves the framework and component crates at
# opt-level 0 with full debug info and optimizes the other dependencies (.cargo/config.toml). Here they are not
# workspace members, so they are named.
[profile.dev.package.moqui-app]
opt-level = 0
debug = true

[profile.dev.package.moqui-lib]
opt-level = 0
debug = true

[profile.dev.package.moqui-db]
opt-level = 0
debug = true

[profile.dev.package.moqui-entity]
opt-level = 0
debug = true

[profile.dev.package.moqui-core]
opt-level = 0
debug = true

