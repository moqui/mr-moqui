# The desktop app: a node in the app's own process, shown in a Tauri window (plans/Mobile-Desktop.md, configuration 2).
# Not a workspace member: Tauri and CEF stay out of the server builds and `cargo test --workspace`. `./moq desktop`
# generates target/moqui-app first, which links the framework and the component crates.

[package]
name = "moqui-desktop"
version = "0.1.0"
description = "Desktop app: an MR Moqui node in a Tauri window"
edition = "2021"
license = "CC0-1.0"
publish = false

[lib]
name = "moqui_desktop"
path = "src/lib.rs"

[[bin]]
name = "moqui-desktop"
path = "src/main.rs"

[features]
# With the dev tools, as the server's own build: the Dev AIDE and the browser terminal's command line and shells, used
# when the tray's Developer tools makes the node a dev instance (off by default).
default = ["maximal", "devtools"]
# The package of the node, as in crates/moqui. Maximal has the edge link and calls.
maximal = ["moqui-app/maximal"]
# The Dev package, commented out: the release build (Maximal with the dev tools) is the default now; likely to be
# removed.
# dev = ["moqui-app/dev"]
devtools = ["moqui-app/devtools"]

[dependencies]
moqui-app = { path = "../../target/moqui-app", default-features = false }
moqui-host = { path = "../moqui-host", default-features = false }
moqui-lib = { path = "../moqui-lib" }
# The client of a remote server (src/client/, plans/Mobile-Desktop.md configuration 3): accounts, sign-in, the proxy and
# the sockets.
moqui-client = { path = "../moqui-client" }
# The client's Tauri glue the mobile app shares: the shell's commands, the outbox and drafts commands, the schemes' answer.
moqui-client-tauri = { path = "../moqui-client-tauri" }
# The client's device keys in the OS key store (src/client/keystore.rs): keyring-core, with the store of each OS below,
# as keyring 4 advises an app that picks its stores.
keyring-core = "1"
moqui-core = { path = "../moqui-core", default-features = false }
# Backup names and the last backup's time (src/backup.rs), as the framework's.
jiff = "0.2"
# The backup folder and restore dialogs (src/backup.rs). Not tauri-plugin-dialog: its script replaces window.alert
# and window.confirm on every page, the node's too. On Linux the portal, not GTK 3, which the GTK 4 app cannot load.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
serde_json = "1"
# The terminal's binary socket frames to and from the page (src/client/sockets.rs), as the workspace's.
base64 = "0.23"
# The PDF engine's timeout on the app's runtime (src/pdf.rs) and the update download's ceiling (src/updates.rs), the same
# Tokio as Tauri's.
tokio = { version = "1", features = ["time", "sync", "macros"] }
# The update feed, read by the app with a size limit (src/updates.rs, SEC-CLI-118); the version moqui-client and the
# updater plugin build, its TLS theirs.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
tauri = { version = "=3.0.0-alpha.6", features = ["unstable", "tray-icon"] }
# The release tauri, tauri-runtime-cef and tauri-runtime-wry name; pinned with them, as each alpha changes its traits.
tauri-runtime = "=3.0.0-alpha.5"
# Native notifications for the page bridge (src/bridge.rs), with clicks; notify-rust under it on desktop.
tauri-plugin-notification = "=3.0.0-alpha.3"
# The webview runtime: Chromium (CEF) on every desktop OS, in place of the platform WebViews.
tauri-runtime-cef = "=3.0.0-alpha.7"
# Updates from the update feed a bundle is built with (src/updates.rs); registered only when it has one.
tauri-plugin-updater = "=3.0.0-alpha.3"
tracing = "0.1"

# The Keychain on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# The Credential Manager on Windows. Its default search feature (regex) stays off.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# The Secret Service on Linux, over zbus with its own executor (async-io), so it answers from any thread, the main one
# too; no libdbus.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

# SIGTERM for a sidecar node that did not stop when its stdin closed (src/node/sidecar.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# CEF's descriptors marked close-on-exec before the sidecar starts (src/node/sidecar.rs), as the workspace's.
close_fds = "0.3"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

# Its own workspace: not a member of the repository's.
[workspace]

# The repository's crate patches (its Cargo.toml's [patch.crates-io]), which cargo takes only from the root manifest of
# the workspace it builds, so this one names them again: without them the node in the app builds the crates.io releases
# they replace (plans/Security-Review.md SEC-CLI-126). crates/moqui-client/tests/app_workspaces.rs keeps the two equal.
[patch.crates-io]
stun-proto = { git = "https://github.com/moqui/stun-proto", rev = "051ca03ff92d04998cfec70a735d23369117b9c9" }
stun-types = { git = "https://github.com/moqui/stun-proto", rev = "051ca03ff92d04998cfec70a735d23369117b9c9" }
# yrs 0.28.1 with a depth limit on the values an update decodes (patches/README.md; SEC-TLS-95)
yrs = { path = "../../patches/yrs" }

# As in the repository's workspace and target/moqui-app: a debug build leaves the framework and component crates at
# opt-level 0 with full debug info and optimizes the other dependencies (.cargo/config.toml). Here they are not
# workspace members, so they are named.
[profile.dev.package.moqui-app]
opt-level = 0
debug = true

[profile.dev.package.moqui-lib]
opt-level = 0
debug = true

[profile.dev.package.moqui-db]
opt-level = 0
debug = true

[profile.dev.package.moqui-entity]
opt-level = 0
debug = true

[profile.dev.package.moqui-core]
opt-level = 0
debug = true

[profile.dev.package.moqui-llm]
opt-level = 0
debug = true

[profile.dev.package.moqui-git]
opt-level = 0
debug = true

[profile.dev.package.moqui-mail]
opt-level = 0
debug = true

[profile.dev.package.moqui-report]
opt-level = 0
debug = true

[profile.dev.package.moqui-collab]
opt-level = 0
debug = true

[profile.dev.package.moqui-tools]
opt-level = 0
debug = true

[profile.dev.package.moqui-rtc]
opt-level = 0
debug = true

[profile.dev.package.moqui-sip]
opt-level = 0
debug = true

[profile.dev.package.moqui-channels]
opt-level = 0
debug = true

[profile.dev.package.moqui-xmpp]
opt-level = 0
debug = true

[profile.dev.package.moqui-dav]
opt-level = 0
debug = true

