opt-level = 0
debug = true

[profile.dev.package.moqui-git]
opt-level = 0
debug = true

[profile.dev.package.moqui-mail]
opt-level = 0
debug = true

[profile.dev.package.moqui-report]
opt-level = 0
debug = true

[profile.dev.package.moqui-collab]
opt-level = 0
debug = true

[profile.dev.package.moqui-tools]
opt-level = 0
debug = true

