[package]
name = "moqui-lib"
description = "Standalone utilities. No ExecutionContext."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrcodegen = { workspace = true }
datamatrix = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }
indexmap = { workspace = true }
# The hasher of Value::Map and the context stack frames (plans/Profiling3.md W10, D2).
foldhash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
# HTML cleaned to the safe set (src/safe_html.rs), for the framework and the client alike.
ammonia = { workspace = true }
# The ETL CsvExtractor (src/etl.rs), streamed.
csv = { workspace = true }
tracing = { workspace = true }

[features]
# A lib-only program leaves this off. Phase 6 enables it on the crate that calls HTTP.
http = ["dep:reqwest", "dep:bytes"]

[lints]
workspace = true
