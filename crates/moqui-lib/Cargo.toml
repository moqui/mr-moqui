[package]
name = "moqui-lib"
description = "Standalone utilities. No ExecutionContext."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrcodegen = { workspace = true }
datamatrix = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }
indexmap = { workspace = true }
# The hasher of Value::Map and the context stack frames (plans/Profiling3.md W10, D2).
foldhash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
# HTML cleaned to the safe set (src/safe_html.rs), for the framework and the client alike.
ammonia = { workspace = true }
# The ETL CsvExtractor (src/etl.rs), streamed.
csv = { workspace = true }
tracing = { workspace = true }
# The container driver's secret files (src/docker): a tar put into a container, and values zeroized when dropped.
tar = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
# A lib-only program leaves this off. Phase 6 enables it on the crate that calls HTTP.
http = ["dep:reqwest", "dep:bytes", "dep:rustls", "dep:rustls-platform-verifier"]
# The age file format (src/age.rs).
age = ["dep:hmac", "dep:hkdf", "dep:chacha20poly1305", "dep:curve25519-dalek"]
# AWS Signature Version 4 (src/sigv4.rs): the S3 client's and the seal's AWS KMS method's.
sigv4 = ["dep:hmac", "dep:zeroize"]
# An S3 client with SigV4 signing (src/s3.rs), for encrypted backups.
s3 = ["http", "age", "sigv4"]
# The Docker and Podman Engine API client (src/docker), which CI's runs and managed instances share.
docker = ["http", "dep:tar", "dep:zeroize"]
# The fake engine (src/docker/fake.rs) for the tests of a crate that uses the driver.
docker-fake = ["docker"]

# Opt-in: a container with a secret file on a real Docker or Podman socket (docs/Build-Test.md). Run by name, with
# MOQUI_CI_DOCKER_SOCKET set: cargo test -p moqui-lib --features docker --test docker_real
[[test]]
name = "docker_real"
path = "tests/docker_real.rs"
test = false
required-features = ["docker"]

[lints]
workspace = true
