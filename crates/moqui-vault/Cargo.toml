# The vault crypto of plans/Vault-Instances.md §3.2, with no I/O and no framework dependency: the formats, Argon2id and
# HKDF, the HPKE wraps, Ed25519 signatures on wraps and leases, the item AEAD with its associated data, the lease and
# machine-access seals, Shamir shares and zeroized key types. Linked natively by the server, the shells and the moqui
# command, and built to wasm32-unknown-unknown for the browser (feature wasm), so a vault opens the same way everywhere.

[package]
name = "moqui-vault"
description = "The vault crypto: formats, wraps, signatures and seals, native and wasm."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Native builds: randomness from the OS.
std = ["dep:getrandom"]
# The browser module: a raw extern "C" ABI, randomness imported from the page. It answers the known-answer vectors,
# so it carries the fixed test stream.
wasm = ["test-vectors", "dep:serde_json"]
# rng::TestRng, the fixed stream the known-answer vectors are made with. Never a key's source.
test-vectors = ["dep:serde_json"]

[dependencies]
aes-gcm = { workspace = true, features = ["zeroize"] }
# Local, not the workspace entry: that one's default features pull getrandom, which the wasm build must leave out.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek.workspace = true
getrandom = { workspace = true, optional = true }
hkdf.workspace = true
hpke.workspace = true
# The vectors and the wasm module's JSON calls.
serde_json = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
