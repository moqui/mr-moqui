# The framework and tools components' runtime files, a webroot stub and the runtime's confs, built into the binary: a
# runtime reads each one that is not on disk from here, the host compares the files on disk with them at startup and
# logs each difference, and `moqui embedded extract` writes them out (runtime/README.md). Its own crate with no
# framework dependency, so an edit to a framework file rebuilds only this crate and relinks; build.rs packs the files.

[package]
name = "moqui-embedded"
description = "The framework, tools, webroot stub and conf files built into the binary, read where a runtime does not have them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = { workspace = true }
similar = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }

[lints]
workspace = true
