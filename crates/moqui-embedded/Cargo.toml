# The runtime files built into the binary (the framework and tools components, a webroot stub and the runtime's confs,
# and with the production or all feature the other components too): a runtime reads each one that is not on disk from
# here, the host compares the files on disk with them at startup and logs each difference, and `moqui embedded extract`
# writes them out (docs/Run-Deploy.md, Built-in runtime files). Its own crate with no framework dependency, so an edit
# to a framework file rebuilds only this crate and relinks; build.rs packs the files.

[package]
name = "moqui-embedded"
description = "The runtime files built into the binary, read where a runtime does not have them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The level of the runtime built in (src/select.rs): none is the framework level; `production` is what `./moq archive`
# puts in by default (every base and add-on component less its tests and plans), `all` adds the tests, plans and the dev
# and test sets.
production = []
all = ["production"]

[dependencies]
flate2 = { workspace = true }
similar = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }

[lints]
workspace = true
