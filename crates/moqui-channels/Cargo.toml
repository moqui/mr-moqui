# Business messaging channels (plans/Comms-Framework.md §4.3 "Business channels", C4): network adapters of the chat bridge
# layer, on top of moqui-core (plans/archive/Crate-Split.md). C4-SMS has the first, `sms`: SMS and MMS on the Telnyx
# Messaging API v2 (docs/interfaces/SMS.md). Core reaches it only through moqui_core::extension (its
# chat_bridge_adapters); the host links it under its channels feature, and its /channels/ routes call
# moqui_core::service::chat_bridge.

[package]
name = "moqui-channels"
description = "Business messaging channels: the SMS adapter on Telnyx."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moqui-core = { workspace = true, features = ["http"] }
moqui-lib = { workspace = true, features = ["http"] }
# The Ed25519 signature of a Telnyx webhook: aws-lc-rs, the crypto provider rustls already links (no new crate).
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
# Only to tell a request that never reached the provider (a refused connection) from one whose answer was lost.
reqwest = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# moqui_core::testing, the in-memory entity facade the tests open.
moqui-core = { workspace = true, features = ["http", "test-support"] }

[lints]
workspace = true
