[package]
name = "moqui-client"
description = "The client of a remote MR Moqui server: accounts, device keys, sign-in, the request proxy, the host-held sockets and the offline store. No Tauri, no framework."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Builds for aarch64-linux-android as well as the desktops (plans/Mobile-Desktop.md §5): no async API (reqwest's blocking
# client), no moqui-core, no platform key store (the host supplies one through keys::KeyStore). rusqlite's bundled
# SQLite compiles with the target's C compiler (the NDK's clang for Android).
[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
# The dates of a quoted message in the offline Compose (src/offline.rs), as moqui-lib's.
jiff = { workspace = true }
# http: the sign-in shared with `moqui tui --server` (moqui_lib::remote_login), on this crate's reqwest client.
moqui-lib = { workspace = true, features = ["http"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
