# The Tools app's server side (plans/archive/Tools-Database.md §13): org.moqui.dev.DatabaseServices, with database
# capabilities and the catalog queries per dialect now, and the jobs, SQL runs, data grid and ETL to come. On
# moqui-core, which reaches it only through moqui_core::extension, so an edit here does not rebuild the framework; the
# host links it in every build, and the browser build leaves it out.

[package]
name = "moqui-tools"
description = "The Tools app's database services: capabilities, catalog queries, jobs, SQL, the data grid and ETL."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moqui-core = { workspace = true }
moqui-lib = { workspace = true }
# The DDL builders and the schema comparison's catalog queries (Schema and jobs).
moqui-db = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# ETL and the grid's file source (etl/, files.rs): CSV read directly, format patterns to decimals.
csv = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# moqui_core::testing, and the embedded cluster the capabilities test probes.
moqui-core = { workspace = true, features = ["test-support", "xlsx"] }
moqui-drivers = { workspace = true, features = ["embedded-postgres"] }
# a workbook for the load#SpreadsheetEntity test
rust_xlsxwriter = { workspace = true }

[lints]
workspace = true
