# XMPP for local users (plans/Comms-Framework.md §4.3 "XMPP server (C3)", C3a; docs/interfaces/XMPP.md): the client
# stream over TCP with STARTTLS, direct TLS and WebSocket (RFC 7395); SASL (RFC 6120) and SASL2 (XEP-0388) with
# SCRAM-SHA-256(-PLUS, tls-exporter, XEP-0440), FAST tokens (XEP-0484) and PLAIN as a fallback; Bind 2 (XEP-0386);
# stream management with resumption (XEP-0198); and the mapping of rooms, messages, history, presence and PEP onto
# Moqui chat. On Tokio. It knows no ExecutionContext: what it reads and writes it asks of a `Backend` by service name
# (org.moqui.impl.ChatServices, org.moqui.impl.XmppServices), which moqui-host implements on its request workers;
# moqui-host owns the listeners, the certificates and the notification bus.

[package]
name = "moqui-xmpp"
description = "The XMPP server for local users: client streams, sign-in and the chat mapping."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
jid = { workspace = true }
jiff = { workspace = true }
minidom = { workspace = true }
moqui-lib = { workspace = true }
pbkdf2 = { workspace = true }
rustls = { workspace = true }
rxml = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
