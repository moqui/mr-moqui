# Agent Code, the coding-agent workbench (plans/agent-code/README.md): the command pipeline, the change feed, the
# /agentws protocol, scopes and the environment descriptor, then the harness adapters. On moqui-core; core reaches it
# only through moqui_core::extension. moqui-host links it under its code feature and carries the socket.

[package]
name = "moqui-code"
description = "Agent Code: threads, commands, the change feed and the /agentws protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moqui-core = { workspace = true }
moqui-lib = { workspace = true }
moqui-db = { workspace = true }
getrandom = { workspace = true }
inventory = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
