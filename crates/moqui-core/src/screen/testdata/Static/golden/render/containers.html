</section>

</template><m-box-body height="200"><span class="text-inline" v-text="ec.l10n.localize('body')"></span>
</m-box-body></m-container-box>

</div><div class="q-px-xs col-md-6 col-sm-12 col-xs-12 end"><span class="text-inline" v-text="ec.l10n.localize('two')"></span>

</q-item-section></q-item></q-list></q-btn-dropdown>

<a :href="'http://example.com/x'" class="m-link-text"><span v-text="ec.l10n.localize('Out')"></span></a>
<template v-if="(name)"><p class="text-inline muted" :title="ec.l10n.localize('tip')" v-text="ec.resource.expand('Line ${name}',{'name':()=&gt;(name)})"></p>
</template><span class="text-inline" v-text="ec.l10n.localize('a &lt; b\nnext')"></span>

</m-container-dialog>
