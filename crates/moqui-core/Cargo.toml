[package]
name = "moqui-core"
description = "Framework. Synchronous and multi-threaded. No listen socket and no database driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No direct tokio, axum, postgres, mysql, or postgresql_embedded.
# moqui-lib http is blocking reqwest. rquickjs, croner, argon2,
# pulldown-cmark, and totp-rs stay workspace pins. totp-rs is the second
# factor of phase 11, with qr off as in plans/archive/License-Review.md.
# lettre SMTP is blocking (tokio1 off). imap is blocking (native-tls off).

[dependencies]
bytes = { workspace = true }
inventory = { workspace = true }
moqui-lib = { workspace = true }
moqui-db = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
rquickjs = { workspace = true, features = ["macro"] }
aes = { workspace = true }
cbc = { workspace = true }
des = { workspace = true }
pbkdf2 = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
sha1 = { workspace = true }
oxc_parser = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
ammonia = { workspace = true }
html5ever = { workspace = true }
croner = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lettre = { workspace = true, optional = true }
imap = { workspace = true, optional = true }
mail-parser = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
totp-rs = { workspace = true }
rust_xlsxwriter = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
zip = { workspace = true }
image = { workspace = true, optional = true }
similar = { workspace = true }
yrs = { workspace = true }
pulldown-cmark = { workspace = true }
gix = { workspace = true, optional = true }
gix-pack = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }

# No prebuilt QuickJS bindings ship for this target. bindgen needs libclang and the emsdk sysroot;
# scripts/wasm-env.sh sets both.
[target.'cfg(target_os = "emscripten")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

# Default on. The browser build (crates/moqui-browser, plans/archive/Wasm.md) turns them all off so no
# socket, TLS (aws-lc), or blocking-HTTP code is linked. The packages (docs/Packaging.md) pick them through moqui-host.
# A service of a feature left out is still registered and reports that the feature is not built into this host.
[features]
default = ["mail", "http", "cluster-tls", "git", "image", "xlsx", "llm"]
# Both halves of the email services.
mail = ["smtp", "imap"]
# Outbound SMTP: send#EmailMessage and send#EmailTemplate (password reset, notifications), test#EmailServer's SMTP step.
# rustls reads the extra CA file (email-client tls-ca-file); lettre links it already.
smtp = ["dep:lettre", "dep:rustls"]
# Inbound: IMAP and POP3 poll, the mail client's sync, IDLE and import, inbound MIME, the OAuth sign-in of mail accounts
# and the delivery of mail the host's SMTP listener received. Replies and the client's sends go out through SMTP, so
# this includes it. The OAuth sign-in (service/mail/oauth.rs) calls the providers' token endpoints with the blocking
# HTTP client, so it turns on http.
imap = ["smtp", "dep:imap", "dep:mail-parser", "dep:webpki-roots", "http"]
# remote-rest services, http resource locations, and the OpenSearch backend (blocking reqwest).
http = ["moqui-lib/http"]
# Generated self-signed cluster certificate.
cluster-tls = ["dep:rcgen"]
# git:// resource locations and org.moqui.impl.GitServices (gitoxide; fetch over HTTPS needs `http`).
git = ["dep:gix", "dep:gix-pack", "dep:flate2", "http"]
# org.moqui.impl.ImageServices (convert#Image) and elFinder thumbnails.
image = ["dep:image"]
# The xlsx render mode and org.moqui.impl.SpreadsheetServices.
xlsx = ["dep:rust_xlsxwriter", "dep:calamine"]
# The agent runtime and the model providers (moqui_core::llm, plans/LLM-A2A-Assist.md): provider calls over the blocking
# HTTP client; rust_decimal for costs.
llm = ["http", "dep:rust_decimal"]

[dev-dependencies]
# Model types only. Revue stays behind moqui-tui's ui feature, which this does not turn on.
moqui-tui = { workspace = true, default-features = false, features = ["model"] }

[lints]
workspace = true
