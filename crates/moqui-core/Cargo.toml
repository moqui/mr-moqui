[package]
name = "moqui-core"
description = "Framework. Synchronous and multi-threaded. No listen socket and no database driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No direct tokio, axum, postgres, mysql, or postgresql_embedded.
# moqui-lib http is blocking reqwest. argon2 and
# pulldown-cmark stay workspace pins. The second factor's TOTP is
# `user/totp.rs` on hmac and sha1.
# Mail (lettre, imap) is moqui-mail's (plans/archive/Crate-Split.md).

[dependencies]
foldhash = { workspace = true }
bytes = { workspace = true }
inventory = { workspace = true }
moqui-lib = { workspace = true }
moqui-db = { workspace = true }
moqui-entity = { workspace = true }
encoding_rs = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
regex = { workspace = true }
opentelemetry = { workspace = true, optional = true }
# The manual reader behind /metrics (Prometheus text) is the custom-reader API.
opentelemetry_sdk = { workspace = true, optional = true, features = ["experimental_metrics_custom_reader"] }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
getrandom = { workspace = true }
# The script engine, safe Rust (plans/archive/Script-Engine-Oxide.md).
quickjs-oxide = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
hmac = { workspace = true }
# SCRAM-SHA-256 verifiers of app passwords for XMPP (service/user_keys.rs, plans/Comms-Framework.md §4.3).
pbkdf2 = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
sha1 = { workspace = true }
oxc_parser = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
ammonia = { workspace = true }
html5ever = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rcgen = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
zip = { workspace = true }
image = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
# gzip of outgoing OTLP; already linked through zip's deflate.
flate2 = { workspace = true }
tar = { workspace = true }
# Web Push (the web-push feature).
p256 = { workspace = true, optional = true, features = ["ecdh"] }
hkdf = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }

# Default on. The browser build (crates/moqui-browser, plans/archive/Wasm.md) turns them all off so no
# socket, TLS (aws-lc), or blocking-HTTP code is linked. The packages (docs/Build-Test.md) pick them through moqui-host.
# A service of a feature left out is still registered and reports that the feature is not built into this host.
[features]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-proto", "dep:prost"]
# The generated OTLP gRPC services, for the host's receiver.
grpc = ["telemetry", "opentelemetry-proto/gen-tonic"]
default = ["http", "cluster-tls", "image", "xlsx", "web-push"]
# remote-rest services, http resource locations, and the OpenSearch backend (blocking reqwest).
http = ["moqui-lib/http"]
# Web Push to subscribed browsers (org.moqui.impl.NotificationServices.send#WebPush), over blocking HTTP.
web-push = ["http", "dep:p256", "dep:hkdf", "dep:aes-gcm"]
# Generated self-signed cluster certificate.
cluster-tls = ["dep:rcgen"]
# org.moqui.impl.ImageServices (convert#Image) and elFinder thumbnails.
image = ["dep:image"]
# The xlsx render mode and org.moqui.impl.SpreadsheetServices.
xlsx = ["dep:rust_xlsxwriter", "dep:calamine"]
# moqui_core::testing, the in-memory entity facade, and the test helpers of the crates on this one (moqui-llm,
# moqui-git, moqui-mail).
test-support = ["moqui-entity/test-support"]

[dev-dependencies]
# moqui_core::testing in core's own tests.
moqui-entity = { workspace = true, features = ["test-support"] }
# Model types only. Revue stays behind moqui-tui's ui feature, which this does not turn on.
moqui-tui = { workspace = true, default-features = false, features = ["model"] }
# Verifies the FCM sender's JWT signature (service/fcm_tests.rs); already linked through moqui-lib.
rsa = { workspace = true }

[lints]
workspace = true
