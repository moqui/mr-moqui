# postgresql_embedded's bundled build reads POSTGRESQL_VERSION (default "*")
# and embeds that theseus archive. "=18.6.0" is an exact VersionReq.
# force keeps a shell variable from unpinning the archive reviewed in
# plans/archive/License-Review.md. bundled does not change the crate graph; it
# downloads the archive into the build when the host is compiled.
[alias]
# The tests marked `#[ignore = "slow: ..."]`, which the default `cargo test` skips: the all-screens render, the REST restart gate,
# the xlsx and print tools, the screen report and the notification socket. `cargo test -- --include-ignored` runs everything.
# The binary's `lint --screens --qvt-static` (the same report through the command) is `cargo test -p moqui --test cli -- --ignored`.
test-slow = "test -p moqui-host --test it -- --ignored tools_screens:: gate2:: tool_components:: qvt_report:: notws::"
# rustc warnings plus Clippy. The default Clippy set is already deny
# in the workspace lints.
lint = "clippy --workspace --all-targets -- -D warnings"
# The host without its default features (no server, no embedded Postgres, MySQL or PDF), which `lint` does not build.
lint-min = "clippy -p moqui-host --no-default-features --all-targets -- -D warnings"

# The build profiles, one for each package (docs/Build-Test.md), here rather than in Cargo.toml so they apply to the
# generated crate `./moq build` links add-on components through (target/moqui-app), which is its own workspace. Cargo
# reads this file from the directory it runs in and its parents, so run cargo from the repository.

# Phase 6 unwinds across the service boundary. This is already the compiler default. The debug info stays in the
# object files under target/debug, where debuggers and backtraces read it, instead of being linked into every test
# binary (docs/Build-Test.md, Profiles).
[profile.dev]
panic = "unwind"
split-debuginfo = "unpacked"

# Dependencies optimized in dev and test builds; the workspace crates stay at opt-level 0. A debug
# screen render was about 12x slower than release with unoptimized dependencies, which made the
# screen tests take minutes. Costs one longer build of the dependencies. Their debug info is line
# tables only: file and line in a backtrace; their variables are optimized out anyway, and the full
# info was most of each test binary.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The Maximal package (`./moq build --release`, docs/Build-Test.md).
[profile.release]
panic = "unwind"

# The Lite package (`./moq build --lite`), whose settings the Dev package's develop profile takes: optimized, so it serves and deploys as release does, with incremental builds of
# the workspace and path crates (cargo applies `incremental` to those only) for a quick rebuild after an edit, and more
# codegen units for them. Dependencies keep the release settings; they are built once.
[profile.lite]
inherits = "release"
incremental = true
codegen-units = 256

[profile.lite.package."*"]
codegen-units = 16

# The Dev package (`./moq build`, the default): the Lite package's settings in a profile of its own, so its binary is
# target/develop/moqui beside Lite's. Named develop since dev is cargo's own debug profile, which the Debug package uses.
[profile.develop]
inherits = "lite"

[profile.develop.package."*"]
codegen-units = 16

# The Enterprise package (`./moq build --enterprise`): release settings, in its own target/enterprise.
[profile.enterprise]
inherits = "release"

[env]
POSTGRESQL_VERSION = { value = "=18.6.0", force = true }

# The browser build (plans/archive/Wasm.md, crates/moqui-browser). Source scripts/wasm-env.sh first.
# An ES module factory (createMoqui) for a Web Worker or Node. QuickJS needs far more than
# emscripten's 64KB default stack; a stack overflow check fails at once without it. Memory grows
# with the entity model and the database. JSPI (no Asyncify fallback): an import may suspend the WASM
# stack on a Promise (fetch, OPFS); the suspending exports are listed in crates/moqui-browser/build.rs.
# WasmFS is the filesystem, so the OPFS backend can be mounted for durable SQLite files.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-arg=-sMODULARIZE=1",
    "-C", "link-arg=-sEXPORT_ES6=1",
    "-C", "link-arg=-sEXPORT_NAME=createMoqui",
    "-C", "link-arg=-sENVIRONMENT=web,worker,node",
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sINITIAL_MEMORY=64MB",
    "-C", "link-arg=-sSTACK_SIZE=8MB",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=HEAPU8,FS",
    "-C", "link-arg=-sJSPI",
    "-C", "link-arg=-sWASMFS",
]
